[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The search function renders the selection card, whose modules read the world summary and its systems from disk at load
# (site/world-context-plan.mts finds it under the project root, marked by pnpm-workspace.yaml). Both functions search
# the built object catalogue, the feature index and the places catalogues from disk (site/server/search-data.mts):
# fetching them over HTTP made a new instance's first search take 3 to 4.5 s.
[functions]
  # site/build/bundle-netlify-functions.mts writes one self-contained module per function here at the end of build:deploy;
  # Netlify's own tracing would leave the renderer's TypeScript subpaths external, which Node cannot load.
  directory = "netlify/functions-bundled"
  included_files = ["pnpm-workspace.yaml", "src/objects/sun/prepared/world-context-summary.json", "src/objects/sun/prepared/world-index.json",
    "src/objects/*/prepared/members.json", "src/objects/*/prepared/places.json",
    "dist/catalogue/index.json", "public/features/index.json", "public/scenes/*/*-places.json"]

# This tiny router preserves optional view and category parameters. Search work
# runs in a Node function; ordinary pages and scene assets stay on the CDN.
[[edge_functions]]
  path = "/*"
  function = "search-route"

# Astro names every built asset under /_astro/ by its content hash, so a file there never changes: browsers keep it for a
# year instead of revalidating it on every page (Netlify's default, max-age=0 with must-revalidate).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
