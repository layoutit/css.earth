# Netlify is the standby host; deploy/netlify holds its functions. This file stays at the repository root: `netlify deploy`
# (netlify-cli 27.8.0) has no option naming a configuration file, reads netlify.toml from its --cwd, and resolves every
# path below from that directory, which must be this root for included_files to reach src/ and site/public/.
[build]
  command = "pnpm build"
  publish = "dist"
  # The edge router sits with the functions in deploy/netlify; Netlify's default directory is netlify/edge-functions.
  edge_functions = "deploy/netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

# The search function renders the selection card, whose modules read the world summary and its systems from disk at load
# (site/directory/world-context-plan.mts finds it under the project root, marked by pnpm-workspace.yaml). Both functions search
# the built object catalogue, the feature index and the places catalogues from disk (site/server/search-data.mts):
# fetching them over HTTP made a new instance's first search take 3 to 4.5 s.
[functions]
  # deploy/netlify/bundle-functions.mts writes one self-contained module per function here at the end of build:deploy;
  # Netlify's own tracing would leave the renderer's TypeScript subpaths external, which Node cannot load.
  directory = "deploy/netlify/functions-bundled"
  included_files = ["pnpm-workspace.yaml", "src/objects/observable-universe/prepared/world.json", "src/objects/observable-universe/prepared/world-index.json",
    "src/objects/*/prepared/members.json", "src/objects/*/prepared/places.json",
    "dist/catalogue/index.json", "site/public/features/index.json", "site/public/scenes/*/*-places.json"]

# This tiny router preserves optional view and category parameters. Search work
# runs in a Node function; ordinary pages and scene assets stay on the CDN.
[[edge_functions]]
  path = "/*"
  function = "search-route"

# Astro names every built asset under /_astro/ by its content hash, so a file there never changes: browsers keep it for a
# year instead of revalidating it on every page (Netlify's default, max-age=0 with must-revalidate).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
