<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star mask trial · Nebula Lab</title>
<style>
:root { color-scheme: dark; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #dfdfdf; background: #080808; }
* { box-sizing: border-box; }
body { margin: 0; }
button, select, input { font: inherit; }
button, select { color: inherit; background: #202124; border: 1px solid #393b3f; border-radius: 5px; padding: 8px 12px; }
button, select, input[type="range"] { cursor: pointer; }
button:hover { background: #2a2c30; }
button[aria-pressed="true"] { border-color: #a9acb5; background: #35373b; }
:focus-visible { outline: 2px solid #c2ccd8; outline-offset: 3px; }
header { background: #151515; border-bottom: 1px solid #292b2e; display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 12px 20px; }
h1 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.4px; }
.case-field { display: flex; gap: 8px; align-items: center; }
.case-field > span { color: #a9acb5; font-size: 12px; }
select { max-width: min(430px, calc(100vw - 100px)); }
.info { margin-left: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; color: #a9acb5; }
main { max-width: 1112px; padding: 20px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; padding: 0 0 18px; }
.modes { display: flex; gap: 5px; }
.slider { display: grid; grid-template-columns: auto minmax(80px, 140px) 3ch; align-items: center; gap: 9px; }
.slider span { font-size: 12px; color: #a9acb5; }
input[type="range"] { width: 100%; margin: 0; accent-color: #c2ccd8; }
output { font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
.comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 512px)); gap: 24px; }
figure { margin: 0; min-width: 0; }
figcaption { color: #a9acb5; font-size: 12px; margin-bottom: 8px; }
.image-frame { width: 100%; max-width: 512px; aspect-ratio: 1; background: #000; border: 1px solid #292b2e; box-sizing: content-box; }
.image-frame img { display: block; width: 100%; height: auto; }
#status { color: #8e929b; min-height: 1.5em; margin: 14px 0 0; font-size: 12px; }
#status[data-error="true"] { color: #f0a49e; }
#help { max-width: 330px; color: #dfdfdf; background: #202124; border: 1px solid #393b3f; border-radius: 6px; padding: 14px; font-size: 13px; }
#help p { margin: 0; }
@media (max-width: 680px) { header { padding: 12px; gap: 10px; } main { padding: 14px 12px; } .comparison { grid-template-columns: minmax(0, 512px); justify-content: center; gap: 18px; } .controls { gap: 14px; } .slider { flex: 1 1 200px; grid-template-columns: 75px minmax(80px, 1fr) 3ch; } .modes { width: 100%; } .modes button { flex: 1; } }
</style>
</head>
<body>
<header>
  <h1>Nebula Lab · Star mask trial</h1>
  <label class="case-field"><span>Crop</span><select id="case" aria-label="Image crop" disabled><option>Loading…</option></select></label>
  <button class="info" type="button" popovertarget="help" aria-label="About this trial" title="Neural predicted background; an image-based mask, not physical stellar truth.">i</button>
</header>
<div id="help" popover><p>NOX predicts the background behind stars. The mask measures image differences; it is not physical stellar truth. Compare nebular detail before using a result. Only this native crop is processed.</p></div>
<main>
  <div class="controls">
    <div class="modes" role="group" aria-label="Comparison result">
      <button type="button" data-mode="current" aria-pressed="false">Current</button>
      <button type="button" data-mode="mask" aria-pressed="false">Mask</button>
      <button type="button" data-mode="removed" aria-pressed="true">Removed (NOX)</button>
    </div>
    <label class="slider" title="How readily predicted stellar light enters the mask."><span>Sensitivity</span><input id="sensitivity" type="range" min="0" max="100" value="80" /><output id="sensitivity-value" for="sensitivity">80</output></label>
    <label class="slider" title="Extend the mask around stars, in native image pixels."><span>Halo · px</span><input id="halo" type="range" min="0" max="8" step="1" value="0" /><output id="halo-value" for="halo">0</output></label>
  </div>
  <div class="comparison" id="comparison" aria-busy="true">
    <figure><figcaption>Original · native crop</figcaption><div class="image-frame"><img id="original" alt="Original native crop" width="512" height="512" /></div></figure>
    <figure><figcaption id="result-label">Removed (NOX)</figcaption><div class="image-frame"><img id="result" alt="Star removal result" width="512" height="512" /></div></figure>
  </div>
  <p id="status" role="status" aria-live="polite">Loading crops…</p>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const choice = $('case'), original = $('original'), result = $('result'), status = $('status');
const sensitivity = $('sensitivity'), halo = $('halo'), comparison = $('comparison');
const buttons = [...document.querySelectorAll('[data-mode]')];
const labels = { current: 'Current removal', mask: 'Mask', removed: 'Removed (NOX)' };
let cases = [], mode = 'removed', revision = 0, timer = null, pending = null, objectUrl = null;
function setStatus(message, error = false) { status.textContent = message; status.dataset.error = String(error); }
function invalidate() { revision++; clearTimeout(timer); timer = null; pending?.abort(); pending = null; }
async function show(token) {
  const row = cases.find(value => value.id === choice.value); if (!row) return;
  const selectedMode = mode, started = performance.now();
  const controller = pending = new AbortController();
  comparison.setAttribute('aria-busy', 'true'); setStatus('Updating crop…');
  let nextUrl;
  try {
    const url = selectedMode === 'current' ? row.baseline : `/preview?${new URLSearchParams({ case: row.id, sensitivity: sensitivity.value, halo: halo.value, mode: selectedMode })}`;
    const response = await fetch(url, { signal: controller.signal });
    if (!response.ok) throw new Error(`Crop unavailable (${response.status}).`);
    nextUrl = URL.createObjectURL(await response.blob());
    const decoded = new Image(); decoded.src = nextUrl; await decoded.decode();
    if (token !== revision || controller.signal.aborted) return;
    if (decoded.naturalWidth !== row.width || decoded.naturalHeight !== row.height) throw new Error('Preview dimensions differ from the native crop.');
    original.src = row.source; result.src = nextUrl;
    if (objectUrl) URL.revokeObjectURL(objectUrl); objectUrl = nextUrl; nextUrl = null;
    $('result-label').textContent = labels[selectedMode]; result.alt = labels[selectedMode];
    const elapsed = Math.round(performance.now() - started);
    setStatus(`${elapsed} ms preview${Number.isFinite(row.noxSeconds) ? ` · ${Math.round(row.noxSeconds * 1000)} ms NOX` : ''}`);
    comparison.dataset.case = row.id; comparison.dataset.mode = selectedMode;
    comparison.dataset.sensitivity = sensitivity.value; comparison.dataset.halo = halo.value;
  } catch (error) {
    if (token === revision && error.name !== 'AbortError') setStatus(error.message, true);
  } finally {
    if (nextUrl) URL.revokeObjectURL(nextUrl);
    if (token === revision) { pending = null; comparison.setAttribute('aria-busy', 'false'); }
  }
}
function schedule(delay = 0) { invalidate(); const token = revision; timer = setTimeout(() => { timer = null; void show(token); }, delay); }
choice.addEventListener('change', () => schedule());
for (const button of buttons) button.addEventListener('click', () => {
  mode = button.dataset.mode; for (const item of buttons) item.setAttribute('aria-pressed', String(item === button)); schedule();
});
for (const input of [sensitivity, halo]) input.addEventListener('input', () => {
  $(`${input.id}-value`).value = input.value; schedule(100);
});
window.addEventListener('pagehide', () => { invalidate(); if (objectUrl) URL.revokeObjectURL(objectUrl); });
try {
  const response = await fetch('/manifest.json'); if (!response.ok) throw new Error('Crop catalogue is unavailable.');
  const manifest = await response.json(); cases = manifest.cases;
  if (!Array.isArray(cases) || !cases.length) throw new Error('Crops are still preparing. Reload in a moment.');
  choice.replaceChildren(...cases.map(row => { const option = document.createElement('option'); option.value = row.id; option.textContent = row.label; return option; }));
  choice.disabled = false; schedule();
} catch (error) { comparison.setAttribute('aria-busy', 'false'); setStatus(error.message, true); }
</script>
</body>
</html>
