<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astronomy data ledger</title>
<style>
/* The cssEarth shell tokens (site/site.css), so the ledger reads like the application. */
:root {
  --shell-text: #dfdfdf;
  --shell-text-secondary: #b0b0b0;
  --shell-text-muted: #858585;
  --shell-background: #000;
  --shell-surface: #141414;
  --shell-surface-hover: #212121;
  --shell-divider-muted: rgb(255 255 255 / 12%);
  --shell-border: rgb(255 255 255 / 20%);
  --shell-ui-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shell-font-content: 400 15px/20px var(--shell-ui-font);
  --shell-font-metadata: 400 13px/18px var(--shell-ui-font);
  --shell-font-section-heading: 500 15px/20px var(--shell-ui-font);
  --shell-font-panel-heading: 500 22px/28px var(--shell-ui-font);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--shell-background); color: var(--shell-text); font: var(--shell-font-content); }
a { color: var(--shell-text); text-decoration: underline; text-decoration-color: var(--shell-border); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--shell-text); }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font: var(--shell-font-panel-heading); margin: 0 0 4px; }
h2 { font: var(--shell-font-section-heading); margin: 32px 0 8px; }
.muted { color: var(--shell-text-muted); font: var(--shell-font-metadata); margin: 0 0 20px; }
.back { display: inline-block; margin-bottom: 16px; color: var(--shell-text-secondary); font: var(--shell-font-metadata); }
table { width: 100%; border-collapse: collapse; }
th { font: var(--shell-font-metadata); color: var(--shell-text-muted); text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--shell-border); white-space: nowrap; position: sticky; top: 0; background: var(--shell-background); }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--shell-divider-muted); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { color: var(--shell-text-secondary); }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover td { background: var(--shell-surface-hover); }
td .sub { color: var(--shell-text-muted); font: var(--shell-font-metadata); }
td.meta { color: var(--shell-text-secondary); font: var(--shell-font-metadata); }
td.reason { color: var(--shell-text-secondary); font: var(--shell-font-metadata); max-width: 520px; }
td img { width: 64px; height: 48px; object-fit: cover; display: block; background: var(--shell-surface); }
.proposal td { border-bottom: 0; }
.writeup td { padding-bottom: 16px; border-bottom: 1px solid var(--shell-divider-muted); color: var(--shell-text-secondary); font: var(--shell-font-metadata); }
.writeup pre { white-space: pre-wrap; font: inherit; margin: 8px 0 0; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 16px; }
.filters input[type="search"], .filters select { font: var(--shell-font-metadata); color: var(--shell-text); background: var(--shell-surface); border: 1px solid var(--shell-border); border-radius: 4px; padding: 6px 10px; }
.filters input[type="search"] { width: 240px; }
.filters .check { display: inline-flex; align-items: center; gap: 6px; color: var(--shell-text-secondary); font: var(--shell-font-metadata); cursor: pointer; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover, th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--shell-text); }
.caret { font: inherit; color: var(--shell-text-muted); background: none; border: 0; padding: 0; width: 20px; text-align: left; cursor: pointer; }
.caret:hover { color: var(--shell-text); }
.sub-inline { color: var(--shell-text-muted); font: var(--shell-font-metadata); margin-left: 6px; }
tbody tr.link:not(.system):not(.member) td:first-child { padding-left: 20px; }
tr.member td:first-child { padding-left: 40px; }
tr.member td { color: var(--shell-text-secondary); }
tr.kind td { font: var(--shell-font-section-heading); color: var(--shell-text); padding-top: 28px; border-bottom: 1px solid var(--shell-border); cursor: pointer; }
tr.kind:first-child td { padding-top: 12px; }
.loading { color: var(--shell-text-muted); }
@media (max-width: 700px) { td.reason, th.reason, td.hide, th.hide { display: none; } tr.member td:first-child { padding-left: 24px; } .filters input[type="search"] { width: 100%; } }
</style>
</head>
<body>
<main id="main"><p class="loading">Reading the ledger…</p></main>
<script type="module" src="/app.js"></script>
</body>
</html>
