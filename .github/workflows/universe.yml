name: Shared universe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: universe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universe:
    name: Prepared universe and shared renderer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages and affected entry points
        run: |
          pnpm build:packages
          pnpm build:renderer
          pnpm build:preparation
      - name: Typecheck renderer and preparation
        run: |
          pnpm typecheck:renderer
          pnpm typecheck:preparation
      - name: Test prepared source, materials and world context
        run: |
          pnpm test:preparation --universe
          node --test tools/objects/material-composition/coplanar-raster.test.mjs
      - name: Test shared scientific source credits
        run: node --test site/test/scene-sources.test.mjs
      - name: Restore pinned JSON transports for runtime and shell tests
        run: |
          node --test tools/restore-object-json.test.mjs
          node tools/restore-object-json.mjs
      - name: Test selected dataset textures and bounded residency
        run: |
          node --test src/platform/object-selection-runtime.test.mjs src/platform/prepared-residency.test.mjs tests/objects/unit/earth/dataset-selection.test.mjs tests/objects/unit/earth/surface-image-banks.test.mjs
      - name: Test prepared minimap point ownership, range and coverage
        run: node --test site/test/minimap-point-range.test.mjs site/test/minimap-point-coverage.test.mjs
      - name: Test shared shell and search ownership
        run: >-
          node --test site/test/shell-lifetime.test.mjs
          site/test/navigation-router.test.mjs site/test/planet-shell.test.mjs
          site/test/router-runtime.test.mjs
          site/test/object-page-data.test.mjs
      - name: Enforce activation preparation for every registered object
        run: node --test tools/prepared-activation-groups.test.mjs tools/prepared-activation-registry.test.mjs
      - name: Test complete shared renderer and camera
        run: pnpm test:renderer
