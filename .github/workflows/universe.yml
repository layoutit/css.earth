name: Shared universe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's new push cancels its stale run. Every push to main keeps its own group (keyed by SHA) and is never
  # cancelled: a shared group would still drop a pending main run when a third merge arrives.
  group: universe-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four parallel jobs. Contract lint needs no build or restored asset and answers within about two minutes; the
# others repeat the install and build they need. `pnpm check:pr` runs the Contract lint steps locally.
jobs:
  lint:
    name: Contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # The publish gate reads the last green main run to scope a push to main.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: the documentation and published-assets checks diff against a merge base, and
          # `git diff --name-only` needs only commits and trees.
          fetch-depth: 0
          filter: blob:none
      - name: Check documentation links and organization
        # A PR checks the Markdown it changes (and links into what it deletes); main and local runs check all.
        run: |
          python3 tools/audits/test_documentation_links.py
          python3 tools/audits/test_provenance_documentation_inventory.py
          python3 tools/audits/provenance-documentation-inventory.py --repo . --ref HEAD --output "$RUNNER_TEMP/provenance-inventory.json"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python3 tools/audits/check-documentation-links.py --base "origin/$GITHUB_BASE_REF"
          else
            python3 tools/audits/check-documentation-links.py --all
          fi
      - name: Check tracked files against ignore rules
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked-paths"
          set +e
          git check-ignore --no-index --stdin -z < "$RUNNER_TEMP/tracked-paths" > "$RUNNER_TEMP/ignored-tracked"
          check_result=$?
          tr '\0' '\n' < "$RUNNER_TEMP/ignored-tracked"
          test "$check_result" -eq 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the registry, renderer and preparation bundle
        # Only what these checks import: SCENE_OBJECTS (site/objects.mts), the renderer the prepared-object reader
        # imports, and tools/objects/dist/operations.js. No build:tools, no restored asset.
        run: |
          pnpm build:packages
          pnpm build:renderer
          pnpm prepare:catalog
          pnpm --filter @cssearth/engine exec tsup --config ../../tools/objects/tsup.config.ts
      - name: Check every object's package files, source citations and restoration plan
        run: |
          node --test tools/restore-source-inputs.test.mts
          node --test --test-name-pattern='authored object directory contains data and pinned sources only' tests/objects/source-closure.test.mts
      - name: Check physical frame receipts and document pins
        # Tracked files only; the full ownership audit (--all) runs in the prepared-universe job.
        run: |
          node tools/check-object-runtime-ownership.mts --receipts
          node --test tools/physical-frame-receipts.test.mts
      - name: Check independent body additions
        run: node --test tools/body-additions.test.mts
      - name: Test asset inventory, publish verification, closure and local CI tooling
        # Self-contained unit tests (temp-directory fixtures, injected fetchers/transports/git repos, no network, no
        # restored assets) for the inventory builders, the publish gate below, the object-scope gate (its own
        # workflow, object-scope.yml), the prune dry-run report, and the runner behind `pnpm check:pr`. Deliberately
        # not the wider `pnpm test:platform`, which this workflow does not run and which has known unrelated failures.
        run: >-
          node --test tools/runtime-assets.test.mts
          tools/publish-verification.test.mts
          tools/check-assets-published.test.mts
          src/platform/runtime-asset-closure.test.mts
          tools/object-scope-gate.test.mts
          tools/prune-runtime-assets.test.mts
          tools/check-ci.test.mts
      - name: Check published assets this change adds
        # HEAD only the R2 keys this change's inventories add (keys are content-addressed, so an unchanged line
        # needs no new proof): on a PR, against its base branch; on a push to main, against the last green main
        # run (a full sweep when there is none). The full sweep of every key is nightly (nightly.yml).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            pnpm check:assets-published --added-since-last-green
          else
            pnpm check:assets-published --added-since="origin/${GITHUB_BASE_REF:-main}"
          fi
      - name: Enforce activation preparation for every registered object
        run: node --test tools/prepared-activation-groups.test.mts tools/prepared-activation-registry.test.mts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - name: Prepare the minimap and source records the shell imports
        run: |
          pnpm prepare:environment-images
          pnpm prepare:minimap
          pnpm prepare:sources
      - name: Typecheck shared code and enforce TypeScript ownership
        # typecheck:shared is `pnpm typecheck` without typecheck:nebula, which the nebula job runs.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:shared
          pnpm check:typescript-ownership
          pnpm test:typescript-ownership

  universe:
    name: Prepared universe and shared renderer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The galaxy-field acquisition sha-verifies a cached catalogue and skips its download.
          path: .local/galaxy-field/sources
          key: galaxy-field-sources-${{ hashFiles('src/objects/nearby-universe/source/catalogue.json') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: prepared-assets
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        # setup:assets restores public/scenes AND each object's prepared-assets.json inventory (prepared/runtime.json
        # + prepared/scene.json, or a context/nebula object's whole prepared/ output) — git no longer tracks those
        # files, and prepare:object-json reads them.
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        # Main only: a 2.3 GB save costs a minute or more, and PR-scoped entries would crowd the 10 GB cache.
        if: github.event_name == 'push' && steps.prepared-assets.outputs.cache-hit != 'true'
        with:
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
      - name: Test unavailable prepared packages and focus controls
        run: >-
          node --test tools/prepare-context-availability.test.mts
          site/test/prepared-context-navigation.test.mts
          site/test/prepared-focus-card.test.mts site/test/volume-presentation.test.mts
      - name: Test authored preparation publication and cache
        # None of these tests launches a browser (preparation-cache names a headless-shell path in a fixture string
        # only), so this job installs no Chromium.
        run: |
          node --test --test-concurrency=1 \
            tests/objects/prepared-finalization.test.mts \
            tests/objects/publication.test.mts \
            tools/write-prepared-set.test.mts \
            tools/preparation-cache.test.mts \
            tools/prepare-planets.test.mts
      - name: Restore environment images and prepare minimap
        run: |
          pnpm prepare:environment-images
          pnpm prepare:minimap
      - name: Bake and test the scientific galaxy field
        run: pnpm test:galaxy-field
      - name: Test source records, provenance and scientific credits
        run: pnpm test:sources
      - name: Test prepared source, materials and world context
        run: |
          pnpm test:preparation --universe
          node --test tools/objects/material-composition/coplanar-raster.test.mts
      - name: Test pinned JSON transport restoration
        run: node --test tools/restore-object-json.test.mts
      - name: Test FITS decoding and offline reference comparisons
        # Small independent FITS inputs are checked in; no archive downloads or Python needed.
        run: pnpm test:fits --unit
      - name: Test SBMT oracle contract and offline projection cases
        # Native SBMT and real-body archive restoration are opt-in local checks.
        run: |
          pnpm typecheck:oracles
          pnpm test:sbmt --unit
      - name: Test selected dataset textures and bounded residency
        run: |
          node --test src/platform/object-selection-runtime.test.mts src/platform/prepared-residency.test.mts tests/objects/unit/earth/dataset-selection.test.mts tests/objects/unit/earth/surface-image-banks.test.mts
      - name: Test prepared minimap point ownership, range and coverage
        run: node --test site/test/minimap-point-range.test.mts site/test/minimap-point-coverage.test.mts
      - name: Test shared shell and search ownership
        run: >-
          node --experimental-test-module-mocks --import ./site/test/navigation-router-context.mts
          --test site/test/shell-lifetime.test.mts
          site/test/navigation-router.test.mts site/test/planet-shell.test.mts
          site/test/router-runtime.test.mts
          site/test/object-page-data.test.mts
          site/test/search-response.test.mts
          site/test/dataset-response.test.mts
          site/test/dataset-url.test.mts
          site/test/browser-node-imports.test.mts
          tools/serialize-prepared-scene.test.mts
      - name: Check every object's runtime ownership and physical frame receipt
        run: node tools/check-object-runtime-ownership.mts --all

  nebula:
    name: Internal nebula packages and isolated controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies without preparing application assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared TypeScript dependencies and the renderer
        run: |
          pnpm -r --filter "./packages/**" build
          pnpm build:renderer
      - name: Install the browser used by isolated control tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check all nebula packages, tests and dependency boundaries
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:nebula
          pnpm check:nebula-boundaries
          node --test tools/nebula/package-boundaries.test.mts tools/nebula/inbound-boundaries.test.mts tools/nebula/application/*.test.mts tools/nebula/application/*.test.ts tools/nebula-provenance-source-closure.test.mts
      - name: Test numerical owners, durable jobs and isolated React controls
        # Explicit cache-independent selection. Do not substitute test:lab:nebula:
        # that command restores real source assets before running the wider suite.
        # Browser helpers use fresh contexts and synthetic local pages, not a lab server.
        run: >-
          node labs/nebula/run.mts test
          overlay-placement overlay-registration overlay-alignment
          field-tilt emission-window component-material material
          point-projection cloud-inspection compact
          detect-shapes structure-wavelets structure-map ridge-graph
          material-solver shape-prior solver
          acquisition footprint image-links image-ranking
          operation-jobs plugin-lifecycle implementation
          lab-shell shape-cloud-state shape-cloud-scheduler
          control-portals browser-regression browser-camera overlay-store
          workspace-sections workspace-portals workspace-objects camera-model-panel image-appearance-panel
          catalogue object-browser papers survey-images
          geometry-model observation-alignment structures-model
      - name: Test complete shared renderer and camera
        # Needs only the built packages and renderer, so it runs here instead of after the prepared-universe restore.
        run: pnpm test:renderer
