name: Shared universe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's new push cancels its stale run. Every push to main keeps its own group (keyed by SHA) and is never
  # cancelled: a shared group would still drop a pending main run when a third merge arrives.
  group: universe-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Contract lint needs no build or restored asset and answers within about two minutes; `pnpm check:pr` runs its
# steps locally. The heavy jobs start after it, in parallel, and any of them failing cancels the run. A docs-only
# pull request (tools/classify-changes.mts) skips the heavy jobs entirely; Contract lint alone (doc links and
# placement) still runs, and a push to main always runs everything.
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_typecheck: ${{ steps.classify.outputs.run_typecheck }}
      run_universe: ${{ steps.classify.outputs.run_universe }}
      run_universe_preparation: ${{ steps.classify.outputs.run_universe_preparation }}
      run_nebula: ${{ steps.classify.outputs.run_nebula }}
      runtime_ownership_args: ${{ steps.ownership-scope.outputs.args }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: a PR needs a merge base with its base branch, and a push needs the previous tip;
          # `git diff --name-only` reads only commits and trees either way.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify what this change touched, and which heavy jobs it needs
        # .github/ci-areas.json maps changed paths to areas, and areas to the heavy jobs below (tools/ci-affected.mts).
        # A push to main always runs every job regardless of this output (see each job's `if:`); only a pull request
        # can skip one. `docs_only` is kept for callers outside this workflow that still read it.
        id: classify
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node tools/ci-affected.mts pr "origin/$GITHUB_BASE_REF"
          else
            node tools/ci-affected.mts push "${{ github.event.before }}"
          fi
      - name: Scope the runtime ownership check
        id: ownership-scope
        # Computed here (this checkout already has the full history a merge-base diff needs) so the "Prepared
        # universe and shared renderer" job's own checkout can stay shallow. A push to main always keeps --all.
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            echo "args=$(node tools/scope-runtime-ownership-check.mts "origin/$GITHUB_BASE_REF")" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # The publish gate reads the last green main run to scope a push to main.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: the documentation and published-assets checks diff against a merge base, and
          # `git diff --name-only` needs only commits and trees.
          fetch-depth: 0
          filter: blob:none
      - name: Check documentation links and organization
        # A PR checks the Markdown it changes (and links into what it deletes); main and local runs check all.
        run: |
          python3 tools/audits/test_documentation_links.py
          python3 tools/audits/test_provenance_documentation_inventory.py
          python3 tools/audits/provenance-documentation-inventory.py --repo . --ref HEAD --output "$RUNNER_TEMP/provenance-inventory.json"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python3 tools/audits/check-documentation-links.py --base "origin/$GITHUB_BASE_REF"
          else
            python3 tools/audits/check-documentation-links.py --all
          fi
      - name: Check tracked files against ignore rules
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked-paths"
          set +e
          git check-ignore --no-index --stdin -z < "$RUNNER_TEMP/tracked-paths" > "$RUNNER_TEMP/ignored-tracked"
          check_result=$?
          tr '\0' '\n' < "$RUNNER_TEMP/ignored-tracked"
          test "$check_result" -eq 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: lint-bundle-cache
        with:
          # Everything the next step writes: packages/renderer/tools-objects builds, and prepare:catalog's,
          # prepare-solar-geometry's and prepare:titles' generated (gitignored) files. Keyed on their own inputs, so
          # a change under any of them (or to an object's own object.json) invalidates it; anything else reuses it.
          path: |
            packages/*/dist
            src/renderers/css/dist
            tools/objects/dist
            site/prepared-object-catalog.mts
            site/prepared-object-discovery.json
            site/prepared-context-objects.mts
            site/prepared-object-distances.json
            site/prepared-focus-objects.json
            src/platform/solar-geometry.mts
            site/prepared-shell-titles.mjs
          key: lint-bundle-v1-${{ hashFiles('tools/**', 'packages/**', 'src/renderers/**', 'site/*.mts', 'site/source/titles/**', 'src/objects/*/object.json') }}
      - name: Generate the registry, renderer and preparation bundle
        # Only what these checks import: SCENE_OBJECTS (site/objects.mts), the renderer the prepared-object reader
        # imports, and tools/objects/dist/operations.js with the solar geometry and shell titles it bundles. The
        # rest of build:tools (navigation, world context, shell assets) and every restored asset are left out.
        # Skipped outright on a cache hit (see lint-bundle-cache above); tools/check-ci.mts always runs it locally.
        if: steps.lint-bundle-cache.outputs.cache-hit != 'true'
        run: |
          pnpm build:packages
          pnpm build:renderer
          pnpm prepare:catalog
          node tools/prepare-solar-geometry.mts > "$RUNNER_TEMP/solar-geometry.log"
          pnpm prepare:titles
          pnpm --filter @cssearth/engine exec tsup --config ../../tools/objects/tsup.config.ts
      - name: Check every object's package files, source citations and restoration plan
        run: |
          node --test tools/restore-source-inputs.test.mts
          node --test --test-name-pattern='authored object directory contains data and pinned sources only' tests/objects/source-closure.test.mts
      - name: Check physical frame receipts and document pins
        # Tracked files only; the full ownership audit (--all) runs in the prepared-universe job.
        run: |
          node tools/check-object-runtime-ownership.mts --receipts
          node --test tools/physical-frame-receipts.test.mts
      - name: Check independent body additions
        run: node --test tools/body-additions.test.mts
      - name: Test asset inventory, publish verification, closure and local CI tooling
        # Self-contained unit tests (temp-directory fixtures, injected fetchers/transports/git repos, no network, no
        # restored assets) for the inventory builders, the publish gate below, the object-scope gate (its own
        # workflow, object-scope.yml), the docs-only classifier (the `changes` job above), the deploy allow-missing
        # path (tools/setup.test.mts — the only place it ran before was the non-CI test:platform), the prune
        # dry-run report, and the runner behind `pnpm check:pr`. Deliberately not the wider `pnpm test:platform`,
        # which this workflow does not run and which has known unrelated failures.
        run: >-
          node --test tools/runtime-assets.test.mts
          tools/stage-published-assets.test.mts
          tools/publish-verification.test.mts
          tools/check-assets-published.test.mts
          src/platform/runtime-asset-closure.test.mts
          tools/object-scope-gate.test.mts
          tools/classify-changes.test.mts
          tools/scope-runtime-ownership-check.test.mts
          tools/setup.test.mts
          tools/prune-runtime-assets.test.mts
          tools/check-ci.test.mts
      - name: Check published assets this change adds
        # HEAD only the R2 keys this change's inventories add (keys are content-addressed, so an unchanged line
        # needs no new proof): on a PR, against its base branch, failing only on a real 404; on a push to main,
        # against the last green main run (a full sweep when there is none), reporting only. Unverified (network)
        # keys never fail. Findings go to the job summary. The full sweep of every key is nightly (nightly.yml).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            pnpm check:assets-published --added-since-last-green --report-only
          else
            pnpm check:assets-published --added-since="origin/${GITHUB_BASE_REF:-main}"
          fi

  typecheck:
    name: Typecheck
    needs: [lint, changes]
    # Start only after Contract lint, and still start when it failed, only to fail at once: a job skipped by a
    # failed `needs` reports "skipped", which a ruleset counts as passing. A pull request whose changed areas do not
    # need Typecheck (.github/ci-areas.json, computed by the `changes` job) skips it, reporting success, not
    # failure — unless lint itself did not pass, which must still run and fail here, never skip. A push to main
    # never skips.
    if: ${{ !cancelled() && (needs.lint.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Stop when Contract lint did not pass
        if: needs.lint.result != 'success'
        run: |
          echo "::error::Contract lint did not pass, so this job stops here."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # node_modules itself, on top of setup-node's pnpm store cache: with both warm, --frozen-lockfile mostly
          # verifies rather than re-links every workspace package.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Every tsc invocation in typecheck:pr writes its own .tsbuildinfo (never astro check, which never reads
          # this cache) under output/tsbuildinfo/; tsc's own file-hash bookkeeping recompiles only what changed
          # since the restored state, so a stale entry only costs a slower, still-correct run, never a wrong one.
          # This step runs before `pnpm install` so the hash below never matches a vendored tsconfig.json.
          path: output/tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-main-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - name: Prepare the minimap and source records the shell imports
        run: |
          pnpm prepare:environment-images
          pnpm prepare:minimap
          pnpm prepare:sources
      - name: Typecheck shared code and enforce TypeScript ownership
        # typecheck:pr is `pnpm typecheck` without typecheck:tests (main-only: the "Typecheck test files" job and the
        # nightly workflow; it is most of the typecheck time) and typecheck:nebula (the nebula job runs it).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:pr
          pnpm check:typescript-ownership
          pnpm test:typescript-ownership

  typecheck-tests:
    name: Typecheck test files
    needs: [lint, changes]
    # Type-checking test files is most of the typecheck time, so a pull request runs it only when it touches the
    # source those files reference (the same `run_typecheck` classification the Typecheck job uses); a one-body or
    # docs pull request still skips it and stays at ~1.2 min. Gating on "the pull request changed a test file"
    # would not work: a signature change in ordinary source breaks a test stub the pull request never opened,
    # which is exactly how #373 reddened main and blocked its own deploy. Costs no wall clock on the pull requests
    # that do run it — 3.5-4.5 min in parallel inside a run that already takes ~8.3 min. A push to main and the
    # nightly workflow still always run it. Not a required check.
    if: ${{ !cancelled() && (needs.lint.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Stop when Contract lint did not pass
        if: needs.lint.result != 'success'
        run: |
          echo "::error::Contract lint did not pass, so this job stops here."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # See the Typecheck job: one .tsbuildinfo per tsc program, keyed the same way, so a warm cache here
          # recompiles only the test/fixture/capture files that changed since the last run on this branch.
          path: output/tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-main-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - name: Prepare the minimap and source records the shell imports
        run: |
          pnpm prepare:environment-images
          pnpm prepare:minimap
          pnpm prepare:sources
      - name: Typecheck test, fixture and capture files
        # One unbatched program over the whole tests/tsconfig.json closure (tools/typecheck-tests.mts); a 6 GB heap
        # covers the 3.9 GB the audit measured, well inside the runner's 16 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck:tests

  universe:
    name: Prepared universe and shared renderer
    needs: [lint, changes]
    # Start only after Contract lint, and still start when it failed, only to fail at once: a job skipped by a
    # failed `needs` reports "skipped", which a ruleset counts as passing. A pull request whose changed areas do not
    # need this job (.github/ci-areas.json, computed by the `changes` job) skips it, reporting success, not
    # failure — unless lint itself did not pass, which must still run and fail here, never skip. A push to main
    # never skips.
    if: ${{ !cancelled() && (needs.lint.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Stop when Contract lint did not pass
        if: needs.lint.result != 'success'
        run: |
          echo "::error::Contract lint did not pass, so this job stops here."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: prepared-assets
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        # setup:assets restores public/scenes AND each object's prepared-assets.json inventory (prepared/runtime.json
        # + prepared/scene.json, or a context/nebula object's whole prepared/ output) — git no longer tracks those
        # files, and prepare:object-json reads them.
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        # Main only: a 2.3 GB save costs a minute or more, and PR-scoped entries would crowd the 10 GB cache. This
        # is the only one of the two prepared-universe jobs that saves; the other only restores (same pattern as
        # the Typecheck job), so the two parallel jobs never race to write the same cache key.
        if: github.event_name == 'push' && steps.prepared-assets.outputs.cache-hit != 'true'
        with:
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
      - name: Test unavailable prepared packages and focus controls
        run: >-
          node --test tools/prepare-context-availability.test.mts
          site/test/prepared-context-navigation.test.mts
          site/test/galactic-focus.test.mts
          site/test/prepared-focus-card.test.mts site/test/volume-presentation.test.mts
      - name: Restore environment images and prepare minimap
        run: |
          pnpm prepare:environment-images
          pnpm prepare:minimap
      - name: Test source records, provenance and scientific credits
        run: pnpm test:sources
      - name: Test pinned JSON transport restoration
        run: node --test tools/restore-object-json.test.mts
      - name: Test FITS decoding and offline reference comparisons
        # Small independent FITS inputs are checked in; no archive downloads or Python needed.
        run: pnpm test:fits --unit
      - name: Test SBMT oracle contract and offline projection cases
        # Native SBMT and real-body archive restoration are opt-in local checks.
        run: |
          pnpm typecheck:oracles
          pnpm test:sbmt --unit
      - name: Test selected dataset textures and bounded residency
        run: |
          node --test src/platform/object-selection-runtime.test.mts src/platform/prepared-residency.test.mts tests/objects/unit/earth/dataset-selection.test.mts tests/objects/unit/earth/surface-image-banks.test.mts
      - name: Test the minimap setting and prepared minimap point ownership, range and coverage
        run: node --test site/test/asset-origin.test.mts site/test/minimap-setting.test.mts site/test/minimap-point-range.test.mts site/test/minimap-point-coverage.test.mts
      - name: Test shared shell and search ownership
        run: >-
          node --experimental-test-module-mocks --import ./site/test/navigation-router-context.mts
          --test site/test/shell-lifetime.test.mts
          site/test/navigation-router.test.mts site/test/planet-shell.test.mts
          site/test/router-runtime.test.mts
          site/test/object-page-data.test.mts
          site/test/search-response.test.mts
          site/test/dataset-response.test.mts
          site/test/dataset-url.test.mts
          site/test/browser-node-imports.test.mts
          site/test/navigation-tree-data.test.mts
          tools/serialize-prepared-scene.test.mts
      - name: Enforce activation preparation for every registered object
        # Reads every object's restored prepared/runtime.json, so it stays after the restore, not in Contract lint.
        run: node --test tools/prepared-activation-groups.test.mts tools/prepared-activation-registry.test.mts
      - name: Check every object's runtime ownership and physical frame receipt
        # Scoped to the objects this PR touched (tools/scope-runtime-ownership-check.mts, computed in the `changes`
        # job above); --receipts in Contract lint already covers a scoped run's only real failure mode, and --all
        # still runs whenever this PR also touched shared code, or on every push to main.
        env:
          RUNTIME_OWNERSHIP_ARGS: ${{ needs.changes.outputs.runtime_ownership_args }}
        run: |
          # shellcheck disable=SC2086 # intentional word-splitting: one or more "--object <id>" pairs, or "--all"
          node tools/check-object-runtime-ownership.mts $RUNTIME_OWNERSHIP_ARGS
      - name: Test complete shared renderer and camera
        # Reads restored prepared volumes and the generated world context and catalog, so it stays after the restore.
        run: pnpm test:renderer

  universe-preparation:
    name: Prepared universe preparation and galaxy field
    needs: [lint, changes]
    # Start only after Contract lint, and still start when it failed, only to fail at once: a job skipped by a
    # failed `needs` reports "skipped", which a ruleset counts as passing. Split out of the `universe` job so the
    # two halves of "Prepared universe and shared renderer" run in parallel at roughly equal length; see
    # output/CI_OPTIMIZATION.md section 6, item 3. A pull request whose changed areas do not need this job
    # (.github/ci-areas.json, computed by the `changes` job) skips it, reporting success, not failure; a push to
    # main never skips, and a failed lint still fails here, not skip.
    if: ${{ !cancelled() && (needs.lint.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Stop when Contract lint did not pass
        if: needs.lint.result != 'success'
        run: |
          echo "::error::Contract lint did not pass, so this job stops here."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The galaxy-field acquisition sha-verifies a cached catalogue and skips its download.
          path: .local/galaxy-field/sources
          key: galaxy-field-sources-${{ hashFiles('src/objects/nearby-universe/source/catalogue.json') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # setup:assets sha-verifies every restored file and downloads only what is missing or changed. This job
          # only restores (like Typecheck); the `universe` job above owns the conditional save.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-assets-v1-${{ hashFiles('src/objects/*/runtime-assets.json', 'src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-assets-v1-
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore prepared assets and object JSON
        run: |
          pnpm setup:assets
          pnpm prepare:object-json
      - name: Test authored preparation publication and cache
        # Finalization renders through headless Chromium, so the browser stays installed here.
        run: |
          pnpm exec playwright install --with-deps chromium
          node --test --test-concurrency=1 \
            tests/objects/prepared-finalization.test.mts \
            tests/objects/publication.test.mts \
            tools/write-prepared-set.test.mts \
            tools/preparation-cache.test.mts \
            tools/prepare-planets.test.mts
      - name: Bake and test the scientific galaxy field
        run: pnpm test:galaxy-field
      - name: Test prepared source, materials and world context
        run: |
          pnpm test:preparation --universe
          node --test tools/objects/material-composition/coplanar-raster.test.mts

  nebula:
    name: Internal nebula packages and isolated controls
    needs: [lint, changes]
    # Start only after Contract lint, and still start when it failed, only to fail at once: a job skipped by a
    # failed `needs` reports "skipped", which a ruleset counts as passing. A pull request whose changed areas do not
    # need this job (.github/ci-areas.json, computed by the `changes` job) skips it, reporting success, not
    # failure — unless lint itself did not pass, which must still run and fail here, never skip. A push to main
    # never skips.
    if: ${{ !cancelled() && (needs.lint.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.run_nebula == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Stop when Contract lint did not pass
        if: needs.lint.result != 'success'
        run: |
          echo "::error::Contract lint did not pass, so this job stops here."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies without preparing application assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared TypeScript dependencies
        run: pnpm -r --filter "./packages/**" build
      - name: Test the object registry and adapter packages
        # 802 tests, ~6 s local; never ran in CI before (output/TEST_AUDIT.md section 1.5). Needs only the build
        # above, so it runs here rather than adding another checkout+install in Contract lint.
        run: pnpm test:packages
      - name: Install the browser used by isolated control tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check all nebula packages, tests and dependency boundaries
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:nebula
          pnpm check:nebula-boundaries
          node --test tools/nebula/package-boundaries.test.mts tools/nebula/inbound-boundaries.test.mts tools/nebula/application/*.test.mts tools/nebula/application/*.test.ts tools/nebula-provenance-source-closure.test.mts
      - name: Test numerical owners, durable jobs and isolated React controls
        # Explicit cache-independent selection. Do not substitute test:lab:nebula:
        # that command restores real source assets before running the wider suite.
        # Browser helpers use fresh contexts and synthetic local pages, not a lab server.
        run: >-
          node labs/nebula/run.mts test
          overlay-placement overlay-registration overlay-alignment
          field-tilt emission-window component-material material
          point-projection cloud-inspection compact shape-cloud-camera
          nebula-frame bake retained-material-bank optical-composite-preparation
          detect-shapes structure-wavelets structure-map ridge-graph
          material-solver shape-prior solver
          acquisition footprint image-links image-ranking
          operation-jobs plugin-lifecycle implementation
          lab-shell shape-cloud-state shape-cloud-scheduler
          control-portals browser-regression browser-camera overlay-store
          workspace-sections workspace-portals workspace-objects camera-model-panel image-appearance-panel
          catalogue object-browser papers survey-images
          geometry-model observation-alignment structures-model
          build lens-levels lens-difference lens-radial lens-radial-panel
          registration photometric-mge photometric-prior compiler-defaults simulation-guided compiler-published

  ci-guard:
    name: Report the first CI failure
    # Runs after every other job settles (never before: a `needs` job only starts once every listed job is
    # complete, so this cannot cancel a sibling early — see the commit that removed the old per-job
    # `gh run cancel "$GITHUB_RUN_ID"` steps). Each of those steps cancelled the whole run, including its own
    # still-running job, and GitHub sometimes reported that job's conclusion as "cancelled" instead of "failure" —
    # the real failure disappeared behind a wall of unrelated red checks (seen on PR #343). This job trades early
    # cancellation for a conclusion that is always right: nothing here ever turns a job's own true conclusion into
    # "cancelled", and it points straight at whichever job and step actually failed.
    needs: [lint, changes, typecheck, typecheck-tests, universe, universe-preparation, nebula]
    if: >-
      ${{ always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' ||
      needs.typecheck-tests.result == 'failure' || needs.universe.result == 'failure' ||
      needs.universe-preparation.result == 'failure' || needs.nebula.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Point at the job and step that actually failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate --jq '.jobs')
          found=0
          while IFS= read -r job; do
            job_name=$(echo "$job" | jq -r '.name')
            job_id=$(echo "$job" | jq -r '.id')
            step_name=$(echo "$job" | jq -r '[.steps[]? | select(.conclusion == "failure")][0].name // "(no failed step recorded)"')
            url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${job_id}"
            echo "::error::${job_name} -> ${step_name} failed: ${url}"
            echo "- ❌ **${job_name}** → ${step_name} failed: <${url}>" >> "$GITHUB_STEP_SUMMARY"
            found=1
          done < <(echo "$jobs_json" | jq -c '.[] | select(.conclusion == "failure" and .name != "Report the first CI failure")')
          if [ "$found" -eq 0 ]; then
            echo "::error::A required job failed, but the jobs API has not recorded which one yet."
            echo "- A required job failed; see the run's job list." >> "$GITHUB_STEP_SUMMARY"
          fi
