name: Shared universe

# PR feedback budget: target 2 minutes, maximum 3 minutes from the PR update until
# all merge-required checks finish, including queue/setup time (not per job).
# Keep affected correctness checks blocking; keep exhaustive sweeps and release
# qualification outside the routine PR path. Measure added work against this budget.
# Job timeouts below are safety limits, not the agreed feedback budget.
# Maintenance rules and failure recovery: docs/ci-cd.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's new push cancels its stale run. Every push to main keeps its own group (keyed by SHA) and is never
  # cancelled: a shared group would still drop a pending main run when a third merge arrives.
  group: universe-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent checks start after classification, not after lint. Classification and lint are themselves
# required checks: a failure there blocks merging without manufacturing failures in five unrelated jobs.
# Main runs every lane; PRs and the local runner use the same affected-path map.
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_typecheck: ${{ steps.classify.outputs.run_typecheck }}
      run_universe: ${{ steps.classify.outputs.run_universe }}
      run_universe_preparation: ${{ steps.classify.outputs.run_universe_preparation }}
      run_nebula: ${{ steps.classify.outputs.run_nebula }}
      run_tools: ${{ steps.tools.outputs.run_tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: a PR needs a merge base with its base branch, and a push needs the previous tip;
          # `git diff --name-only` reads only commits and trees either way.
          fetch-depth: 0
          filter: blob:none
          # Classification reads Git trees, not object bytes. Keep the complete diff/history without
          # transferring the source-media bank before any validation job can start.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/**/*.mts
            /packages/core/src/validate.ts
            /.github/ci-areas.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify what this change touched, and which heavy jobs it needs
        # .github/ci-areas.json maps changed paths to areas, and areas to the heavy jobs below (.github/scripts/ci/ci-affected.mts).
        # A push to main always runs every job regardless of this output (see each job's `if:`); only a pull request
        # can skip one. `docs_only` is kept for callers outside this workflow that still read it.
        id: classify
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node .github/scripts/ci/ci-affected.mts pr "origin/$GITHUB_BASE_REF"
          else
            node .github/scripts/ci/ci-affected.mts push "${{ github.event.before }}"
          fi
      - name: Test the preparation and archive tools only when the change touches them
        # packages/bake and packages/telescope-cli are offline tools, not what the site ships: a pull request that leaves
        # them alone skips their tests. A push to main runs them.
        id: tools
        run: |
          if [ -z "${GITHUB_BASE_REF:-}" ] || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^packages/(bake|telescope-cli)/'; then
            echo run_tools=true >> "$GITHUB_OUTPUT"
          else
            echo run_tools=false >> "$GITHUB_OUTPUT"
          fi
      - name: Check that every commit is one Conventional Commits line with no attribution
        # Required with the rest of this job. A local commit-msg hook gives the same answer earlier, but a hook can be
        # skipped; this reads the pull request's own commits (merge base to head), so the merge itself is never counted.
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..$HEAD_SHA"

  lint:
    name: Contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Body source and evidence data (images, archives, cubes, video: about 790 of 1,070 MB) is never read by
          # these jobs, so fetch only the blobs the sparse tree needs. Nebula adds its volume packages below
          # for tracked previews and compact inputs.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &code-and-text |
            /*
            !/src/objects/**/*.gz
            !/src/objects/**/*.png
            !/src/objects/**/*.zst
            !/src/objects/**/*.zip
            !/src/objects/**/*.ktx2
            !/src/objects/**/*.webp
            !/src/objects/**/*.tif
            !/src/objects/**/*.jpg
            !/src/objects/**/*.pdf
            !/src/objects/**/*.cub
            !/src/objects/**/*.webm
            !/src/objects/**/*.nc
            !/src/objects/**/*.obj
            !/src/objects/**/*.shp
            !/src/objects/**/*.gxct
            !/src/objects/**/*.tpc
            !/src/objects/**/*.qub
            !/src/objects/**/*.wrl
            !/src/objects/**/*.cmod
            !/src/objects/**/*.fit
            !/src/objects/**/*.fits
            !/src/objects/**/*.bc
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check that every body stays restorable from its declared sources
        # Each declared source file is committed, restored by an acquisition step or made by its named generator;
        # papers are cited by URL and shared tables live once in src/references or src/spice. Under a second.
        run: pnpm check:body-references
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - name: Generate the registry and renderer
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: node .github/scripts/ci/build-ci.mts lint
      - name: Check the architecture against its baseline
        # Fails when a change adds a folder-cycle edge or a forbidden import (.github/scripts/architecture/rules.mts) that
        # .github/scripts/architecture/baseline.json does not record, or breaks a repository rule (repository-rules.mts:
        # the retired tools/ folder, the nebula boundaries, declared workspace dependencies and pre-install imports), which has no baseline. It reads every source file this sparse tree keeps, so a
        # missing one stops it as incomplete rather than passing. About eight seconds.
        run: pnpm check:architecture
      - name: Check every investigation ledger
        # Parses every object and facility ledger and the shared records they quote (packages/bake/src/sources), through the
        # report the contract names, so an empty ledger, a check without its commit or a relative evidence path fails here.
        run: pnpm check:investigations

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # node_modules itself, on top of setup-node's pnpm store cache: with both warm, --frozen-lockfile mostly
          # verifies rather than re-links every workspace package.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Every tsc invocation in typecheck:pr writes its own .tsbuildinfo (never astro check, which never reads
          # this cache) under output/tsbuildinfo/; tsc's own file-hash bookkeeping recompiles only what changed
          # since the restored state, so a stale entry only costs a slower, still-correct run, never a wrong one.
          # The tracked-only digest never traverses installed dependency trees.
          path: output/tsbuildinfo
          key: tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: node .github/scripts/ci/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck shared code and enforce TypeScript ownership
        # Application types here; the parallel test-file and nebula jobs own their compiler programs.
        env:
          # The site typecheck used 4.2 GB with 4,043 objects (exoplanet batch 1, 2026-09-29).
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm typecheck:pr

  typecheck-tests:
    name: Typecheck test files
    needs: changes
    # Source signatures can break unchanged tests, so use the same owner selection as application types.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep this lane separate: caches are immutable, so sharing the application's key lets the
          # faster test job prevent the application from saving its own compiler state.
          path: output/tsbuildinfo
          key: tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: node .github/scripts/ci/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck test, fixture and capture files
        # Native tsc builds the per-owner test programs through tsconfig.tests.json; keep a 6 GB heap
        # until per-owner peak measurements justify reducing it; 2026-09-30 peaks were about 4.6 GB on T6 and 5.1 GB on main.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck:tests --extendedDiagnostics

  universe-checks:
    name: Universe / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [packages, site]
    env:
      CI_UNIVERSE_LANE: ${{ matrix.lane }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: node .github/scripts/ci/build-ci.mts full
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the baked JSON payloads, not texture banks. The following installer revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: prepared-json-v1-
      - name: Restore prepared assets and object JSON
        # Every object's JSON remains SHA-verified. Only tests that consume real prepared images restore them;
        # application texture banks are not inputs to these runtime and renderer assertions.
        env:
          # The packages compiled by the build step above; the second build only regenerates the site's prepared data.
          CI_PACKAGE_CACHE_HIT: 'true'
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            pnpm setup:asset-data
          else
            node .github/scripts/ci/prepare-ci-inputs.mts universe
          fi
          # The catalogue, navigation and world context read the restored banks, and restoring the Sun's published
          # assets replaces the context the first build wrote: generate them again from this checkout (packages are cached).
          node .github/scripts/ci/build-ci.mts full
          node site/build/prepare/prepare-feature-index.mts
      - name: Test the selected folder lane
        env:
          RUN_TOOLS: ${{ needs.changes.outputs.run_tools }}
        # `test:packages` runs every test under packages/; `test:site` runs site/, src/, integration/ and .github/.
        # A test whose restored input this job leaves out skips through sourceTest() and names it.
        run: |
          node site/build/prepare/prepare-facilities.mts --catalog-only
          pnpm exec playwright install --with-deps --only-shell chromium
          if [ "$CI_UNIVERSE_LANE" = packages ] && [ "$RUN_TOOLS" = false ]; then
            pnpm test:shipped-packages
            exit 0
          fi
          if [ "$CI_UNIVERSE_LANE" = packages ]; then
            # The volume packages' previews and compact inputs, as the nebula job keeps them, the tracked density sources
            # the volume tests decode (52 MB) and the tracked geology shapefiles.
            git grep -l 'cssearth-volume-source-manifest@2' -- 'src/objects/*/source/manifest.json' |
              while IFS= read -r manifest; do printf '/%s/**\n' "${manifest%/source/manifest.json}"; done | git sparse-checkout add --stdin
            git sparse-checkout add '/src/objects/**/*.shp' '/src/objects/**/*.ktx2'
            node packages/bake/cli/restore-source-inputs.mts --repository-volumes
          else
            pnpm typecheck:oracles
          fi
          pnpm "test:$CI_UNIVERSE_LANE"
  universe:
    name: Prepared universe and shared renderer
    needs: [changes, universe-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every universe lane to pass
        env:
          RESULT: ${{ needs.universe-checks.result }}
        run: test "$RESULT" = success

  universe-preparation-checks:
    name: Preparation / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [publication]
    env:
      CI_PREPARATION_LANE: ${{ matrix.lane }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
        run: node .github/scripts/ci/build-ci.mts full
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the baked JSON payloads, not texture banks. The following installer revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: prepared-json-v1-
      - name: Restore only the inputs consumed by preparation tests
        run: node .github/scripts/ci/prepare-ci-inputs.mts universe-preparation
      - name: Test the selected preparation lane
        run: |
          case "$CI_PREPARATION_LANE" in
            publication)
              pnpm exec playwright install --with-deps --only-shell chromium
              pnpm test:run --test-concurrency=1 "packages/bake/src/delivery/*.test.{ts,mts}"
              ;;
            *) echo "Unknown preparation lane" >&2; exit 1 ;;
          esac

  universe-preparation:
    name: Prepared universe preparation and galaxy field
    needs: [changes, universe-preparation-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every preparation lane to pass
        env:
          RESULT: ${{ needs.universe-preparation-checks.result }}
        run: test "$RESULT" = success

  nebula:
    name: Internal nebula packages and isolated controls
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_nebula == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - name: Include tracked volume package inputs
        # Source manifests own the package list; retain their previews and compact inputs without planetary binaries.
        run: |
          if [ "${GITHUB_ACTIONS:-}" = true ]; then
            git grep -l 'cssearth-volume-source-manifest@2' -- 'src/objects/*/source/manifest.json' |
              while IFS= read -r manifest; do
                printf '/%s/**\n' "${manifest%/source/manifest.json}"
              done | git sparse-checkout add --stdin
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies without preparing application assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/tsbuildinfo/nebula-*.tsbuildinfo
          key: tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Build shared TypeScript dependencies
        run: pnpm -r --filter "./packages/**" build
      - name: Restore repository volume inputs used by provenance closure
        run: node packages/bake/cli/restore-source-inputs.mts --repository-volumes
      - name: Install the browser used by isolated control tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Check all nebula packages and tests
        # Their dependency boundaries are the architecture check's nebula-boundaries rule, which Contract lint runs on every change.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck:nebula
      - name: Test numerical owners, durable jobs and isolated React controls
        # Explicit cache-independent selection. Do not substitute test:lab:nebula:
        # that command restores real source assets before running the wider suite.
        # Browser helpers use fresh contexts and synthetic local pages, not a lab server.
