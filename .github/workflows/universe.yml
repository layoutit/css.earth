name: Shared universe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: universe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universe:
    name: Prepared universe and shared renderer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check documentation links and organization
        run: |
          python3 tools/audits/test_documentation_links.py
          python3 tools/audits/test_provenance_documentation_inventory.py
          python3 tools/audits/provenance-documentation-inventory.py --repo . --ref HEAD --output "$RUNNER_TEMP/provenance-inventory.json"
          python3 tools/audits/check-documentation-links.py --all
      - name: Check tracked files against ignore rules
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked-paths"
          set +e
          git check-ignore --no-index --stdin -z < "$RUNNER_TEMP/tracked-paths" > "$RUNNER_TEMP/ignored-tracked"
          check_result=$?
          tr '\0' '\n' < "$RUNNER_TEMP/ignored-tracked"
          test "$check_result" -eq 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages and affected entry points
        run: |
          pnpm build:packages
          pnpm build:renderer
          pnpm build:preparation
          pnpm prepare:world-context
          pnpm prepare:minimap
      - name: Test source records, provenance and scientific credits
        run: pnpm test:sources
      - name: Check source restoration and tracked inputs
        run: |
          node --test tools/restore-source-inputs.test.mts
          node --test --test-name-pattern='authored object directory contains data and pinned sources only' tests/objects/source-closure.test.mts
      - name: Check independent body additions
        run: node --test tools/body-additions.test.mts tools/prepare-marker-bindings.test.mts
      - name: Typecheck shared code and enforce TypeScript ownership
        run: |
          pnpm typecheck
          pnpm check:typescript-ownership
          pnpm test:typescript-ownership
      - name: Test prepared source, materials and world context
        run: |
          pnpm test:preparation --universe
          node --test tools/objects/material-composition/coplanar-raster.test.mts
      - name: Restore pinned JSON transports for runtime and shell tests
        run: |
          node --test tools/restore-object-json.test.mts
          node tools/restore-object-json.mts
      - name: Test selected dataset textures and bounded residency
        run: |
          node --test src/platform/object-selection-runtime.test.mts src/platform/prepared-residency.test.mts tests/objects/unit/earth/dataset-selection.test.mts tests/objects/unit/earth/surface-image-banks.test.mts
      - name: Test prepared minimap point ownership, range and coverage
        run: node --test site/test/minimap-point-range.test.mts site/test/minimap-point-coverage.test.mts
      - name: Test shared shell and search ownership
        run: >-
          node --test site/test/shell-lifetime.test.mts
          site/test/navigation-router.test.mts site/test/planet-shell.test.mts
          site/test/router-runtime.test.mts
          site/test/object-page-data.test.mts
      - name: Enforce activation preparation for every registered object
        run: node --test tools/prepared-activation-groups.test.mts tools/prepared-activation-registry.test.mts
      - name: Test complete shared renderer and camera
        run: pnpm test:renderer
