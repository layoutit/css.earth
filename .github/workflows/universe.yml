name: Shared universe

# PR feedback budget: target 2 minutes, maximum 3 minutes from the PR update until
# all merge-required checks finish, including queue/setup time (not per job).
# Keep affected correctness checks blocking; keep exhaustive sweeps and release
# qualification outside the routine PR path. Measure added work against this budget.
# Job timeouts below are safety limits, not the agreed feedback budget.
# Maintenance rules and failure recovery: docs/ci-cd.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's new push cancels its stale run. Every push to main keeps its own group (keyed by SHA) and is never
  # cancelled: a shared group would still drop a pending main run when a third merge arrives.
  group: universe-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent checks start after classification, not after lint. Classification and lint are themselves
# required checks: a failure there blocks merging without manufacturing failures in five unrelated jobs.
# Main runs every lane; PRs and the local runner use the same affected-path map.
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_typecheck: ${{ steps.classify.outputs.run_typecheck }}
      run_universe: ${{ steps.classify.outputs.run_universe }}
      run_universe_preparation: ${{ steps.classify.outputs.run_universe_preparation }}
      run_nebula: ${{ steps.classify.outputs.run_nebula }}
      runtime_ownership_args: ${{ steps.ownership-scope.outputs.args }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: a PR needs a merge base with its base branch, and a push needs the previous tip;
          # `git diff --name-only` reads only commits and trees either way.
          fetch-depth: 0
          filter: blob:none
          # Classification reads Git trees, not object bytes. Keep the complete diff/history without
          # transferring the source-media bank before any validation job can start.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.mts
            /.github/ci-areas.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify what this change touched, and which heavy jobs it needs
        # .github/ci-areas.json maps changed paths to areas, and areas to the heavy jobs below (tools/ci-affected.mts).
        # A push to main always runs every job regardless of this output (see each job's `if:`); only a pull request
        # can skip one. `docs_only` is kept for callers outside this workflow that still read it.
        id: classify
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node tools/ci-affected.mts pr "origin/$GITHUB_BASE_REF"
          else
            node tools/ci-affected.mts push "${{ github.event.before }}"
          fi
      - name: Scope the runtime ownership check
        id: ownership-scope
        # Computed here (this checkout already has the full history a merge-base diff needs) so the "Prepared
        # universe and shared renderer" job's own checkout can stay shallow. A push to main always keeps --all.
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            echo "args=$(node tools/scope-runtime-ownership-check.mts "origin/$GITHUB_BASE_REF")" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          # Preparation still uses the conservative whole-tree key; generated data is never cached here.
          path: tools/objects/dist
          key: compiled-preparation-js-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - name: Generate the registry, renderer and preparation bundle
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_PREPARATION_DTS: "false"
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
        run: node tools/build-ci.mts lint
      - name: Check physical frame receipts and document pins
        # Tracked files only; the full ownership audit (--all) runs in the prepared-universe job.
        run: |
          node tools/check-object-runtime-ownership.mts --receipts
          node --test tools/physical-frame-receipts.test.mts
      - name: Check independent body additions
        run: node --test tools/body-additions.test.mts
      - name: Test asset inventory, publish verification, closure and local CI tooling
        # Self-contained unit tests (temp-directory fixtures, injected fetchers/transports/git repos, no network, no
        # restored assets) for the inventory builders, the publish gate below, the object-scope gate (its own
        # workflow, object-scope.yml), the docs-only classifier (the `changes` job above), the deploy allow-missing
        # path (tools/setup.test.mts — the only place it ran before was the non-CI test:platform), the prune
        # dry-run report, and the runner behind `pnpm check:pr`. Deliberately not the wider `pnpm test:platform`,
        # which this workflow does not run. Native filename families include newly added CI/asset checks.
        run: pnpm test:ci

  audit:
    name: Repository and provenance audit (advisory)
    needs: changes
    # Advisory by construction: this job is deliberately NOT in the repository's required status checks, so a
    # failure here is reported on the pull request and in the run summary without vetoing an unrelated change.
    # Nothing is skipped, tolerated or wrapped in `continue-on-error` — every check below still runs on every
    # commit and still turns this job red. What moved here asserts repository *completeness* (a package file that
    # has not been written yet, a source input that cannot be re-downloaded, a stale link, a misplaced file);
    # none of it can make the deployed site broken, wrong or unverifiable. See docs/ci-cd.md, "Gate on what ships".
    # Not on pull requests. Nothing here can block a merge, so running it per pull request spends CI
    # minutes on a report nobody can act on in that context. It runs on every push to main, where the
    # backlog it tracks is actually reconciled, and in the nightly sweep.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Also covers the two relocated bookkeeping lanes, which run here in series where the gate ran them in
    # parallel. This job reports, so its latency sits outside the required-path budget in docs/ci-cd.md.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: the documentation audit diffs against a merge base, and
          # `git diff --name-only` needs only commits and trees.
          fetch-depth: 0
          filter: blob:none
      - name: Check documentation links and organization
        # PRs reject new findings and debt in changed files, including unchanged inbound links they break.
        # Main retains the full organization audit; existing unrelated debt is visible but not a PR veto.
        run: |
          node --test tools/audits/check-documentation-links.test.mts
          python3 tools/audits/test_provenance_documentation_inventory.py
          python3 tools/audits/provenance-documentation-inventory.py --repo . --ref HEAD --output "$RUNNER_TEMP/provenance-inventory.json"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node tools/audits/check-documentation-links.mts --base "${CI_BASE_REF:-origin/$GITHUB_BASE_REF}"
          else
            node tools/audits/check-documentation-links.mts --all
          fi
      - name: Check tracked files against ignore rules
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked-paths"
          set +e
          git check-ignore --no-index --stdin -z < "$RUNNER_TEMP/tracked-paths" > "$RUNNER_TEMP/ignored-tracked"
          check_result=$?
          tr '\0' '\n' < "$RUNNER_TEMP/ignored-tracked"
          test "$check_result" -eq 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Restore-only: `Contract lint` owns the save for every key below, so the two jobs never race to
          # write the same cache entry.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          path: tools/objects/dist
          key: compiled-preparation-js-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the baked JSON payloads, not texture banks. The installer below revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-json-v1-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The galaxy-field acquisition sha-verifies a cached catalogue and skips its download. This job took
          # over the preparation lane that used to own this cache, so it owns the save too.
          path: .local/galaxy-field/sources
          key: galaxy-field-sources-${{ hashFiles('src/objects/nearby-universe/source/catalogue.json') }}
      - name: Generate the registry, renderer and preparation bundle
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_PREPARATION_DTS: "false"
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
          CI_AUDIT_UNIVERSE: ${{ needs.changes.outputs.run_universe }}
          CI_AUDIT_PREPARATION: ${{ needs.changes.outputs.run_universe_preparation }}
        # The contract checks below need only the lint closure. The relocated source and reproduction lanes also
        # read navigation, world context and title assets, so they need the same `full` build they had on the gate.
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_UNIVERSE" != true ] && [ "$CI_AUDIT_PREPARATION" != true ]; then
            node tools/build-ci.mts lint
          else
            node tools/build-ci.mts full
          fi
      - name: Check every object's package files and source restoration plan
        # Package-file completeness (a body without its browser profile or ledger) and source *restorability*
        # (a declared input with neither a tracked copy nor an acquisition operation). Neither reaches the
        # deployed site: it serves the already-baked, sha256-pinned prepared bank from R2. The pins themselves
        # stay blocking in `Contract lint` (physical frame receipts and document pins).
        run: node --test tools/restore-source-inputs.test.mts
      - name: Check authored object directory layout
        run: node --test --test-name-pattern='authored object directory contains data and pinned sources only' tests/objects/source-closure.test.mts
      - name: Reconcile the source catalogue, facility records and provenance receipts
        # Moved off the `Universe / sources` gate lane. These assert that every catalogue row, facility record
        # and provenance receipt reconciles with the tracked sources and their READMEs — repository bookkeeping.
        # The site serves the already-baked, sha256-pinned prepared bank and reads none of it, so a reconciliation
        # gap cannot break a page; the pins that do back shipped bytes stay blocking in `Contract lint`. Nothing
        # is skipped or tolerated: the same commands run in full, with the same arguments, whenever the change
        # selects a universe area — the identical selection the gate lane applied as a job condition.
        env:
          CI_AUDIT_UNIVERSE: ${{ needs.changes.outputs.run_universe }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_UNIVERSE" != true ]; then
            echo "This change selects no universe area; the source catalogue has nothing to reconcile."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then
            pnpm setup:asset-data
          else
            node tools/prepare-ci-inputs.mts universe
          fi
          node tools/restore-object-json.mts
          node tools/prepare-feature-index.mts
          node site/minimap/prepare.mts --data-only
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then
            # Authoring replays volume provenance from pinned FITS.
            node tools/restore-source-inputs.mts --repository-volumes
            pnpm test:sources
          else
            pnpm test:sources:pr
          fi
      - name: Reproduce the prepared bank and the galaxy field from their pinned inputs
        # Moved off the `Preparation / world` gate lane. These re-run a bake and compare it with the recorded
        # output: finalization idempotence, catalogue-row reconciliation, and the point-field recipe reproducing
        # identical JSON and image bytes. The site never bakes anything — it serves the published bank, whose
        # bytes `Contract lint` still verifies by SHA-256 — so a reproduction gap is a stale recipe or a drifted
        # toolchain, visible here, and not a broken page. Nothing is skipped: the same commands run in full.
        env:
          CI_AUDIT_PREPARATION: ${{ needs.changes.outputs.run_universe_preparation }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_PREPARATION" != true ]; then
            echo "This change selects no preparation area; there is no bake to reproduce."
            exit 0
          fi
          node tools/prepare-ci-inputs.mts universe-preparation
          # The galaxy writer finishes before world/provenance readers in this workspace.
          node tools/restore-source-inputs.mts --repository-volumes
          pnpm test:galaxy-field
          pnpm test:ci-preparation:world
      - name: Explain that this job does not gate the merge
        if: failure()
        run: |
          {
            echo "### Repository and provenance audit failed (advisory)"
            echo
            echo "This job reports repository completeness and provenance backlog. It is **not** a required"
            echo "status check: it does not block this pull request. Fix it in the change that owns the gap,"
            echo "or file it as backlog. Merge-blocking proof is what ships: it compiles (\`Typecheck\`), it"
            echo "builds, and it behaves (the universe runtime/shell/renderer lanes and \`Contract lint\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # node_modules itself, on top of setup-node's pnpm store cache: with both warm, --frozen-lockfile mostly
          # verifies rather than re-links every workspace package.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          # Preparation still uses the conservative whole-tree key; generated data is never cached here.
          path: tools/objects/dist
          key: compiled-preparation-dts-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Every tsc invocation in typecheck:pr writes its own .tsbuildinfo (never astro check, which never reads
          # this cache) under output/tsbuildinfo/; tsc's own file-hash bookkeeping recompiles only what changed
          # since the restored state, so a stale entry only costs a slower, still-correct run, never a wrong one.
          # The tracked-only digest never traverses installed dependency trees.
          path: output/tsbuildinfo
          key: tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
        run: node tools/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck shared code and enforce TypeScript ownership
        # Application types here; the parallel test-file and nebula jobs own their compiler programs.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:pr

  typecheck-tests:
    name: Typecheck test files
    needs: changes
    # Source signatures can break unchanged tests, so use the same owner selection as application types.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          # Preparation still uses the conservative whole-tree key; generated data is never cached here.
          path: tools/objects/dist
          key: compiled-preparation-dts-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep this lane separate: caches are immutable, so sharing the application's key lets the
          # faster test job prevent the application from saving its own compiler state.
          path: output/tsbuildinfo
          key: tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
        run: node tools/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck test, fixture and capture files
        # Native tsc checks the whole tests/tsconfig.json closure in one program; a 6 GB heap
        # covers the 3.9 GB the audit measured, well inside the runner's 16 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck:tests --extendedDiagnostics

  universe-checks:
    name: Universe / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [runtime, shell, renderer]
    env:
      CI_UNIVERSE_LANE: ${{ matrix.lane }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          # Preparation still uses the conservative whole-tree key; generated data is never cached here.
          path: tools/objects/dist
          key: compiled-preparation-${{ matrix.lane == 'shell' && 'dts' || 'js' }}-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
        run: |
          if [ "$CI_UNIVERSE_LANE" = shell ]; then
            node tools/build-ci.mts full
          else
            CI_PREPARATION_DTS=false node tools/build-ci.mts full
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the baked JSON payloads, not texture banks. The following installer revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-json-v1-
      - name: Restore prepared assets and object JSON
        # Every object's JSON remains SHA-verified. Only tests that consume real prepared images restore them;
        # application texture banks are not inputs to these runtime and renderer assertions.
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            pnpm setup:asset-data
          else
            node tools/prepare-ci-inputs.mts universe
          fi
          node tools/restore-object-json.mts
          node tools/prepare-feature-index.mts
      - name: Prepare minimap data
        run: |
          node site/minimap/prepare.mts --data-only
      - name: Test the selected universe lane
        # Each runner owns its writers and CPU budget. Native runner discovery is unchanged.
        env:
          RUNTIME_OWNERSHIP_ARGS: ${{ needs.changes.outputs.runtime_ownership_args }}
        run: |
          case "$CI_UNIVERSE_LANE" in
            runtime|shell|renderer)
              node tools/prepare-facilities.mts --catalog-only
              pnpm "test:universe:$CI_UNIVERSE_LANE"
              ;;
            *) echo "Unknown universe lane" >&2; exit 1 ;;
          esac

  universe:
    name: Prepared universe and shared renderer
    needs: [changes, universe-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every universe lane to pass
        env:
          RESULT: ${{ needs.universe-checks.result }}
        run: test "$RESULT" = success

  universe-preparation-checks:
    name: Preparation / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [publication]
    env:
      CI_PREPARATION_LANE: ${{ matrix.lane }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: renderer-cache
        with:
          path: src/renderers/css/dist
          key: compiled-renderer-v2-${{ steps.ci-cache-key.outputs.renderer_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-tools-cache
        with:
          # Preparation still uses the conservative whole-tree key; generated data is never cached here.
          path: tools/objects/dist
          key: compiled-preparation-js-v3-${{ steps.ci-cache-key.outputs.build_digest }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # prepare:shell downloads the pinned title font when it is absent and verifies its SHA-256 either way.
          path: src/objects/earth/source/presentation/InterVariable.ttf
          key: title-font-${{ hashFiles('src/platform/planet-title-recipe.mts') }}
      - name: Build shared packages and affected entry points
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_RENDERER_CACHE_HIT: ${{ steps.renderer-cache.outputs.cache-hit }}
          CI_RENDERER_DIGEST: ${{ steps.ci-cache-key.outputs.renderer_digest }}
          CI_PREPARATION_DTS: "false"
          CI_BUILD_CACHE_HIT: ${{ steps.build-tools-cache.outputs.cache-hit }}
          CI_BUILD_DIGEST: ${{ steps.ci-cache-key.outputs.build_digest }}
        run: node tools/build-ci.mts full
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the baked JSON payloads, not texture banks. The following installer revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/prepared-assets.json') }}
          restore-keys: prepared-json-v1-
      - name: Restore only the inputs consumed by preparation tests
        run: node tools/prepare-ci-inputs.mts universe-preparation
      - name: Test the selected preparation lane
        run: |
          case "$CI_PREPARATION_LANE" in
            publication)
              pnpm exec playwright install --with-deps --only-shell chromium
              pnpm test:ci-preparation:publication
              ;;
            *) echo "Unknown preparation lane" >&2; exit 1 ;;
          esac

  universe-preparation:
    name: Prepared universe preparation and galaxy field
    needs: [changes, universe-preparation-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every preparation lane to pass
        env:
          RESULT: ${{ needs.universe-preparation-checks.result }}
        run: test "$RESULT" = success

  nebula:
    name: Internal nebula packages and isolated controls
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_nebula == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies without preparing application assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node tools/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/tsbuildinfo/nebula-*.tsbuildinfo
          key: tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Build shared TypeScript dependencies
        run: pnpm -r --filter "./packages/**" build
      - name: Restore repository volume inputs used by provenance closure
        run: node tools/restore-source-inputs.mts --repository-volumes
      - name: Test the object registry and adapter packages
        # 802 tests, ~6 s local; never ran in CI before (output/TEST_AUDIT.md section 1.5). Needs only the build
        # above, so it runs here rather than adding another checkout+install in Contract lint.
        run: pnpm test:packages
      - name: Install the browser used by isolated control tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Check all nebula packages, tests and dependency boundaries
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck:nebula
          pnpm check:nebula-boundaries
          pnpm test:nebula-application
      - name: Test numerical owners, durable jobs and isolated React controls
        # Explicit cache-independent selection. Do not substitute test:lab:nebula:
        # that command restores real source assets before running the wider suite.
        # Browser helpers use fresh contexts and synthetic local pages, not a lab server.
        run: >-
          node labs/nebula/run.mts test
          overlay-placement overlay-registration overlay-alignment
          field-tilt emission-window component-material material
          point-projection cloud-inspection compact shape-cloud-camera
          nebula-frame bake compiler-sampling render-element-budget retained-material-bank optical-composite-preparation
          detect-shapes structure-wavelets structure-map ridge-graph
          material-solver shape-prior solver
          acquisition footprint image-links image-ranking
          operation-jobs plugin-lifecycle implementation
          lab-shell shape-cloud-state shape-cloud-scheduler
          control-portals browser-regression browser-camera overlay-store
          workspace-sections workspace-portals workspace-objects camera-model-panel image-appearance-panel
          catalogue object-browser papers survey-images
          geometry-model observation-alignment structures-model
          build lens-levels lens-difference lens-radial lens-radial-panel
          registration photometric-mge photometric-prior compiler-defaults simulation-guided compiler-published

  ci-guard:
    name: Report the first CI failure
    # Runs after every other job settles (never before: a `needs` job only starts once every listed job is
    # complete, so this cannot cancel a sibling early — see the commit that removed the old per-job
    # `gh run cancel "$GITHUB_RUN_ID"` steps). Each of those steps cancelled the whole run, including its own
    # still-running job, and GitHub sometimes reported that job's conclusion as "cancelled" instead of "failure" —
    # the real failure disappeared behind a wall of unrelated red checks (seen on PR #343). This job trades early
    # cancellation for a conclusion that is always right: nothing here ever turns a job's own true conclusion into
    # "cancelled", and it points straight at whichever job and step actually failed.
    needs: [lint, changes, typecheck, typecheck-tests, universe, universe-preparation, nebula]
    if: >-
      ${{ always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' ||
      needs.typecheck-tests.result == 'failure' || needs.universe.result == 'failure' ||
      needs.universe-preparation.result == 'failure' || needs.nebula.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Point at the job and step that actually failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate --jq '.jobs')
          found=0
          while IFS= read -r job; do
            job_name=$(echo "$job" | jq -r '.name')
            job_id=$(echo "$job" | jq -r '.id')
            step_name=$(echo "$job" | jq -r '[.steps[]? | select(.conclusion == "failure")][0].name // "(no failed step recorded)"')
            url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${job_id}"
            echo "::error::${job_name} -> ${step_name} failed: ${url}"
            echo "- ❌ **${job_name}** → ${step_name} failed: <${url}>" >> "$GITHUB_STEP_SUMMARY"
            found=1
          done < <(echo "$jobs_json" | jq -c '.[] | select(.conclusion == "failure" and .name != "Report the first CI failure")')
          if [ "$found" -eq 0 ]; then
            echo "::error::A required job failed, but the jobs API has not recorded which one yet."
            echo "- A required job failed; see the run's job list." >> "$GITHUB_STEP_SUMMARY"
          fi
