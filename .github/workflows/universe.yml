name: Shared universe

# PR feedback budget: target 2 minutes, maximum 3 minutes from the PR update until
# all merge-required checks finish, including queue/setup time (not per job).
# Keep affected correctness checks blocking; keep exhaustive sweeps and release
# qualification outside the routine PR path. Measure added work against this budget.
# Universe file shards overlap tests but repeat isolated-runner setup; measure both in hosted runs.
# Job timeouts below are safety limits, not the agreed feedback budget.
# Maintenance rules and failure recovery: docs/ci-cd.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's new push cancels its stale run. Every push to main keeps its own group (keyed by SHA) and is never
  # cancelled: a shared group would still drop a pending main run when a third merge arrives.
  group: universe-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent checks start after classification, not after lint. Classification and lint are themselves
# required checks: a failure there blocks merging without manufacturing failures in five unrelated jobs.
# Main runs every lane; PRs and the local runner use the same affected-path map.
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_typecheck: ${{ steps.classify.outputs.run_typecheck }}
      run_universe: ${{ steps.classify.outputs.run_universe }}
      run_universe_preparation: ${{ steps.classify.outputs.run_universe_preparation }}
      run_astroquery: ${{ steps.classify.outputs.run_astroquery }}
      run_nebula: ${{ steps.classify.outputs.run_nebula }}
      test_packages: ${{ steps.affected.outputs.test_packages }}
      test_files: ${{ steps.affected.outputs.test_files }}
      test_site: ${{ steps.affected.outputs.test_site }}
      test_matrix: ${{ steps.shards.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: a PR needs a merge base with its base branch, and a push needs the previous tip;
          # `git diff --name-only` reads only commits and trees either way.
          fetch-depth: 0
          filter: blob:none
          # Classification reads Git trees and test source for cross-owner imports and source pins.
          # Keep those scripts/tests and complete diff/history without transferring source media.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/**/*.mts
            /.github/**/*.test.mts
            /packages/core/src/validate.ts
            /packages/core/src/node/script-test-files.ts
            /.github/ci-areas.json
            /package.json
            /packages/*/package.json
            /packages/**/*.test.ts
            /packages/**/*.test.mts
            /integration/**/*.test.ts
            /integration/**/*.test.mts
            /site/**/*.test.ts
            /site/**/*.test.mts
            /site/**/fixtures/**
            /src/**/*.test.*
            /labs/performance/*.test.mts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify what this change touched, and which heavy jobs it needs
        # .github/ci-areas.json maps changed paths to areas, and areas to the heavy jobs below (.github/scripts/ci/ci-affected.mts).
        # A push to main always runs every job regardless of this output (see each job's `if:`); only a pull request
        # can skip one. `docs_only` is kept for callers outside this workflow that still read it.
        id: classify
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node .github/scripts/ci/ci-affected.mts pr "origin/$GITHUB_BASE_REF"
          else
            node .github/scripts/ci/ci-affected.mts push "${{ github.event.before }}"
          fi
      - name: Choose the tests this change can break
        # The packages it touched and every package that depends on one, and the site when it or a package it imports
        # changed (.github/scripts/ci/affected-tests.mts). A push to main, or shared configuration, tests everything.
        id: affected
        run: node .github/scripts/ci/affected-tests.mts ${GITHUB_BASE_REF:+"origin/$GITHUB_BASE_REF"}
      - name: Choose deterministic universe test shards
        id: shards
        env:
          CI_TEST_PACKAGES: ${{ steps.affected.outputs.test_packages }}
          CI_TEST_FILES: ${{ steps.affected.outputs.test_files }}
        run: node .github/scripts/ci/test-shards.mts --matrix
      - name: Check that every commit is one Conventional Commits line with no attribution
        # Required with the rest of this job. A local commit-msg hook gives the same answer earlier, but a hook can be
        # skipped; this reads the pull request's own commits (merge base to head), so the merge itself is never counted.
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..$HEAD_SHA"

  lint:
    name: Contract lint
    runs-on: ubuntu-latest
    # A33: 12 minutes is an unmeasured safety ceiling, not a measured duration budget.
    # Verify with gh run list --workflow universe.yml --branch main --limit 20,
    # then gh run view <id> --json jobs: compare Contract lint startedAt/completedAt
    # across successful cold-cache and warm-cache runs before changing this limit.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Body source and evidence data (images, archives, cubes, video: about 790 of 1,070 MB) is never read by
          # these jobs, so fetch only the blobs the sparse tree needs. Nebula adds its volume packages below
          # for tracked previews and compact inputs.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &code-and-text |
            /*
            !/src/objects/**/*.gz
            !/src/objects/**/*.png
            !/src/objects/**/*.zst
            !/src/objects/**/*.zip
            !/src/objects/**/*.ktx2
            !/src/objects/**/*.webp
            !/src/objects/**/*.tif
            !/src/objects/**/*.jpg
            !/src/objects/**/*.pdf
            !/src/objects/**/*.cub
            !/src/objects/**/*.webm
            !/src/objects/**/*.nc
            !/src/objects/**/*.obj
            !/src/objects/**/*.shp
            !/src/objects/**/*.gxct
            !/src/objects/**/*.tpc
            !/src/objects/**/*.qub
            !/src/objects/**/*.wrl
            !/src/objects/**/*.cmod
            !/src/objects/**/*.fit
            !/src/objects/**/*.fits
            !/src/objects/**/*.bc
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check that every body stays restorable from its declared sources
        # Each declared source file is committed, restored by an acquisition step or made by its named generator;
        # papers are cited by URL and shared tables live once in src/references or src/spice. Under a second.
        run: pnpm check:body-references
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - name: Cache pinned NAIF kernel banks
        # A miss restores from each manifest's NAIF origin; no external mirror is written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/spice/*/*/
          key: naif-kernels-${{ runner.os }}-${{ hashFiles('src/spice/*/manifest.json') }}
      - name: Generate the registry and renderer
        run: node .github/scripts/ci/build-ci.mts lint
      # One writer per digest set: every other lane restores and verifies package receipts.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
      - name: Mutation-check stale reference guard
        run: node --test .github/scripts/checks/check-stale-references.test.mts
      - name: Check live references to retired paths
        run: node .github/scripts/checks/check-stale-references.mts
      - name: Mutation-check architecture rules
        run: node --test .github/scripts/architecture/*.test.mts .github/scripts/architecture/ratchets/*.test.mts
      - name: Check the architecture against its baseline
        # Fails when a change adds a folder-cycle edge or a forbidden import (.github/scripts/architecture/rules.mts) that
        # .github/scripts/architecture/baseline.json does not record, or breaks a repository rule (repository-rules.mts:
        # the retired tools/ folder, the nebula boundaries, declared workspace dependencies and pre-install imports), which has no baseline. It reads every source file this sparse tree keeps, so a
        # missing one stops it as incomplete rather than passing. About eight seconds.
        run: pnpm check:architecture
      - name: Check every investigation ledger
        # Parses every object and facility ledger and the shared records they quote (packages/bake/src/sources), through the
        # report the contract names, so an empty ledger, a check without its commit or a relative evidence path fails here.
        run: pnpm check:investigations

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # node_modules itself, on top of setup-node's pnpm store cache: with both warm, --frozen-lockfile mostly
          # verifies rather than re-links every workspace package.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Every tsc invocation in typecheck:pr writes its own .tsbuildinfo (never astro check, which never reads
          # this cache) under output/tsbuildinfo/; tsc's own file-hash bookkeeping recompiles only what changed
          # since the restored state, so a stale entry only costs a slower, still-correct run, never a wrong one.
          # The tracked-only digest never traverses installed dependency trees.
          path: output/tsbuildinfo
          key: tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-app-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Cache pinned NAIF kernel banks
        # A miss restores from each manifest's NAIF origin; no external mirror is written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/spice/*/*/
          key: naif-kernels-${{ runner.os }}-${{ hashFiles('src/spice/*/manifest.json') }}
      - name: Build shared packages and affected entry points
        run: node .github/scripts/ci/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck shared code and enforce TypeScript ownership
        # Application types here; the parallel test-file and nebula jobs own their compiler programs.
        env:
          # The site typecheck used 4.2 GB with 4,043 objects (exoplanet batch 1, 2026-09-29).
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm typecheck:pr

  typecheck-tests:
    name: Typecheck test files
    needs: changes
    # Source signatures can break unchanged tests, so use the same owner selection as application types.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_typecheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep this lane separate: caches are immutable, so sharing the application's key lets the
          # faster test job prevent the application from saving its own compiler state.
          path: output/tsbuildinfo
          key: tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-tests-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - name: Cache pinned NAIF kernel banks
        # A miss restores from each manifest's NAIF origin; no external mirror is written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/spice/*/*/
          key: naif-kernels-${{ runner.os }}-${{ hashFiles('src/spice/*/manifest.json') }}
      - name: Build shared packages and affected entry points
        run: node .github/scripts/ci/build-ci.mts full
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck test, fixture and capture files
        # Native tsc builds the per-owner test programs through .github/tsconfig.tests.json; keep a 6 GB heap
        # until per-owner peak measurements justify reducing it; 2026-09-30 peaks were about 4.6 GB on T6 and 5.1 GB on main.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck:tests --extendedDiagnostics

  universe-checks:
    name: Universe / ${{ matrix.lane }} / ${{ matrix.shard }} of ${{ matrix.total }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix).include }}
    env:
      CI_UNIVERSE_LANE: ${{ matrix.lane }}
      CI_TEST_SHARD: ${{ matrix.shard }}
      CI_TEST_SHARDS: ${{ matrix.total }}
      CI_TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
      CI_TEST_FILES: ${{ needs.changes.outputs.test_files }}
      # A lane with nothing to test still reports, so the required check passes, but does no work.
      CI_LANE_SKIP: ${{ (matrix.lane == 'packages' && needs.changes.outputs.test_packages == '' && needs.changes.outputs.test_files == '') || (matrix.lane == 'site' && needs.changes.outputs.test_site != 'true') }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.CI_LANE_SKIP != 'true'
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: env.CI_LANE_SKIP != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.CI_LANE_SKIP != 'true'
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_LANE_SKIP != 'true'
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: |
          if [ "$CI_LANE_SKIP" = true ]; then echo "This change can break no test in the $CI_UNIVERSE_LANE lane."; exit 0; fi
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        if: env.CI_LANE_SKIP != 'true'
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_LANE_SKIP != 'true'
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - name: Cache pinned NAIF kernel banks
        # A miss restores from each manifest's NAIF origin; no external mirror is written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_LANE_SKIP != 'true'
        with:
          path: |
            src/spice/*/*/
          key: naif-kernels-${{ runner.os }}-${{ hashFiles('src/spice/*/manifest.json') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_LANE_SKIP != 'true'
        id: prepared-cache
        with:
          # Every prepared file of every object, not texture banks. Caching two file names of them left each job to
          # read 47,000 to 54,000 files from R2: three jobs a run, 93 runs on 2026-10-01, 23 million billed reads that
          # day. The installer below still checks every pin and fetches only what this checkout changed.
          path: src/objects/*/prepared
          key: prepared-files-v2-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: prepared-files-v2-
      - name: Build shared packages and affected entry points
        run: |
          if [ "$CI_LANE_SKIP" = true ]; then exit 0; fi
          node .github/scripts/ci/build-ci.mts packages
      - name: Restore prepared assets and object JSON
        # Every object's JSON remains SHA-verified. Only tests that consume real prepared images restore them;
        # application texture banks are not inputs to these runtime and renderer assertions.
        run: |
          if [ "$CI_LANE_SKIP" = true ]; then exit 0; fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            pnpm setup:asset-data
          else
            node .github/scripts/ci/prepare-ci-inputs.mts universe
          fi
          # Generate once after restoring the Sun's published world context and the other selected banks.
          node .github/scripts/ci/build-ci.mts generators
          node site/build/prepare/prepare-feature-index.mts
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        # Main saves the restored files once per inventory state; pull requests read main's copy and never save their
        # own (a few of those would fill the repository's 10 GB of cache).
        if: ${{ github.event_name == 'push' && matrix.lane == 'site' && matrix.shard == 1 && env.CI_LANE_SKIP != 'true' && steps.prepared-cache.outputs.cache-hit != 'true' }}
        with:
          path: src/objects/*/prepared
          key: prepared-files-v2-${{ hashFiles('src/objects/*/inventory.json') }}
      - name: Test the selected folder lane
        # The packages lane tests the packages this change can break (all of them on a push); `test:site` runs site/, src/,
        # and .github/; integration/ suites run in the packages lane. A test whose restored input this job leaves out skips through sourceTest() and names it.
        run: |
          if [ "$CI_LANE_SKIP" = true ]; then exit 0; fi
          node site/build/prepare/prepare-facilities.mts --catalog-only
          # The runner image already carries Chrome's system libraries: fetch the browser alone. `--with-deps` ran apt-get,
          # which once took 6.5 min on a slow mirror.
          pnpm exec playwright install --only-shell chromium
          if [ "$CI_UNIVERSE_LANE" = packages ]; then
            # The volume packages' previews and compact inputs, as the nebula job keeps them, the tracked density sources
            # the volume tests decode (52 MB) and the tracked geology shapefiles: before the affected packages run too, since
            # the bake's volume tests read them whenever the bake is among them.
            case " $CI_TEST_PACKAGES " in
              *" bake "*|*" objects "*|*" volume-viewer "*|*" all "*)
                git grep -l 'cssearth-volume-source-manifest@2' -- 'src/objects/*/source/manifest.json' |
                  while IFS= read -r manifest; do printf '/%s/**\n' "${manifest%/source/manifest.json}"; done | git sparse-checkout add --stdin
                git sparse-checkout add '/src/objects/**/*.shp' '/src/objects/**/*.ktx2'
                node packages/bake/cli/restore-source-inputs.mts --repository-volumes
                ;;
            esac
          else
            pnpm typecheck:oracles
          fi
          node .github/scripts/ci/test-shards.mts --run
  universe:
    name: Prepared universe and shared renderer
    needs: [changes, universe-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every universe lane to pass
        env:
          RESULT: ${{ needs.universe-checks.result }}
        run: test "$RESULT" = success

  universe-preparation-checks:
    name: Preparation / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [publication]
    env:
      CI_PREPARATION_LANE: ${{ matrix.lane }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - name: Cache pinned NAIF kernel banks
        # A miss restores from each manifest's NAIF origin; no external mirror is written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/spice/*/*/
          key: naif-kernels-${{ runner.os }}-${{ hashFiles('src/spice/*/manifest.json') }}
      - name: Build shared packages and affected entry points
        run: node .github/scripts/ci/build-ci.mts full
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The prepared files main last saved (the lane job above saves them); this job fetches only what differs.
          path: src/objects/*/prepared
          key: prepared-files-v2-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: prepared-files-v2-
      - name: Restore only the inputs consumed by preparation tests
        run: node .github/scripts/ci/prepare-ci-inputs.mts universe-preparation
      - name: Test the selected preparation lane
        run: |
          case "$CI_PREPARATION_LANE" in
            publication)
              pnpm exec playwright install --only-shell chromium
              pnpm test:run --test-concurrency=1 "packages/bake/src/delivery/*.test.{ts,mts}"
              ;;
            *) echo "Unknown preparation lane" >&2; exit 1 ;;
          esac

  universe-preparation:
    name: Prepared universe preparation and galaxy field
    needs: [changes, universe-preparation-checks]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.run_universe_preparation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every preparation lane to pass
        env:
          RESULT: ${{ needs.universe-preparation-checks.result }}
        run: test "$RESULT" = success

  nebula:
    name: Internal nebula packages and isolated controls
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_nebula == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - name: Include tracked volume package inputs
        # Source manifests own the package list; retain their previews and compact inputs without planetary binaries.
        run: |
          if [ "${GITHUB_ACTIONS:-}" = true ]; then
            git grep -l 'cssearth-volume-source-manifest@2' -- 'src/objects/*/source/manifest.json' |
              while IFS= read -r manifest; do
                printf '/%s/**\n' "${manifest%/source/manifest.json}"
              done | git sparse-checkout add --stdin
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies without preparing application assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hash tracked build and compiler inputs
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/tsbuildinfo/nebula-*.tsbuildinfo
          key: tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-${{ github.head_ref || github.ref_name }}-
            tsbuildinfo-nebula-${{ steps.ci-cache-key.outputs.tsconfig_digest }}-main-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v3-${{ steps.ci-cache-key.outputs.package_digest }}
          restore-keys: compiled-packages-v3-
      - name: Build shared TypeScript dependencies
        run: node .github/scripts/ci/build-ci.mts packages
      - name: Restore repository volume inputs used by provenance closure
        run: node packages/bake/cli/restore-source-inputs.mts --repository-volumes
      - name: Install the browser used by isolated control tests
        run: pnpm exec playwright install --only-shell chromium
      - name: Check all nebula packages and tests
        # Their dependency boundaries are the architecture check's nebula-boundaries rule, which Contract lint runs on every change.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck:nebula
      - name: Test numerical owners, durable jobs and isolated React controls
        # Discover every lab and volume-viewer test except *.sources.test.* files, which need restored source assets.
        run: node labs/nebula/run.mts test --without-sources

  astroquery:
    name: Astroquery archive safety and CDF validation
    needs: changes
    if: ${{ needs.changes.outputs.run_astroquery == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CSS_EARTH_ASTROQUERY_CACHE: /home/runner/.cache/css-earth/astroquery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *code-and-text
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/telescope/toolchains/requirements.lock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/css-earth/astroquery
          key: astroquery-${{ runner.os }}-${{ hashFiles('packages/telescope/toolchains/toolchain.json', 'packages/telescope/toolchains/requirements.lock') }}
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the telescope dependency closure
        run: node .github/scripts/architecture/workspace-builds.mts --run @cssearth/telescope-cli @cssearth/bake
      - name: Install micromamba for the toolchain installer
        # The installer runs `micromamba create` and the runner image has no micromamba. A pinned release binary, so the
        # install cannot change under the lane.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/mamba-org/micromamba-releases/releases/download/2.0.5-0/micromamba-linux-64" -o "$HOME/.local/bin/micromamba"
          chmod +x "$HOME/.local/bin/micromamba"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/micromamba" --version
      - name: Install and verify the pinned astroquery toolchain
        run: |
          node packages/telescope-cli/src/toolchains/astronomy-toolchains.mts astroquery install
          node packages/telescope-cli/src/toolchains/astronomy-toolchains.mts astroquery verify
      - name: Require all archive safety and CDF tests to run
        run: |
          node .github/scripts/ci/astroquery-tests.mts --list
          node .github/scripts/ci/astroquery-tests.mts --run

  ci-guard:
    name: Report the first CI failure
    # Runs after every other job settles (never before: a `needs` job only starts once every listed job is
    # complete, so this cannot cancel a sibling early — see the commit that removed the old per-job
    # `gh run cancel "$GITHUB_RUN_ID"` steps). Each of those steps cancelled the whole run, including its own
    # still-running job, and GitHub sometimes reported that job's conclusion as "cancelled" instead of "failure" —
    # the real failure disappeared behind a wall of unrelated red checks (seen on PR #343). This job trades early
    # cancellation for a conclusion that is always right: nothing here ever turns a job's own true conclusion into
    # "cancelled", and it points straight at whichever job and step actually failed.
    needs: [lint, changes, typecheck, typecheck-tests, universe, universe-preparation, nebula, astroquery]
    if: >-
      ${{ always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' ||
      needs.typecheck-tests.result == 'failure' || needs.universe.result == 'failure' ||
      needs.universe-preparation.result == 'failure' || needs.nebula.result == 'failure' || needs.astroquery.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Point at the job and step that actually failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate --jq '.jobs')
          found=0
          while IFS= read -r job; do
            job_name=$(echo "$job" | jq -r '.name')
            job_id=$(echo "$job" | jq -r '.id')
            step_name=$(echo "$job" | jq -r '[.steps[]? | select(.conclusion == "failure")][0].name // "(no failed step recorded)"')
            url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${job_id}"
            echo "::error::${job_name} -> ${step_name} failed: ${url}"
            echo "- ❌ **${job_name}** → ${step_name} failed: <${url}>" >> "$GITHUB_STEP_SUMMARY"
            found=1
          done < <(echo "$jobs_json" | jq -c '.[] | select(.conclusion == "failure" and .name != "Report the first CI failure")')
          if [ "$found" -eq 0 ]; then
            echo "::error::A required job failed, but the jobs API has not recorded which one yet."
            echo "- A required job failed; see the run's job list." >> "$GITHUB_STEP_SUMMARY"
          fi
