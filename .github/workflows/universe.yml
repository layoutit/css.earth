  ci-guard:
    name: Report the first CI failure
    # Runs after every other job settles (never before: a `needs` job only starts once every listed job is
    # complete, so this cannot cancel a sibling early — see the commit that removed the old per-job
    # `gh run cancel "$GITHUB_RUN_ID"` steps). Each of those steps cancelled the whole run, including its own
    # still-running job, and GitHub sometimes reported that job's conclusion as "cancelled" instead of "failure" —
    # the real failure disappeared behind a wall of unrelated red checks (seen on PR #343). This job trades early
    # cancellation for a conclusion that is always right: nothing here ever turns a job's own true conclusion into
    # "cancelled", and it points straight at whichever job and step actually failed.
    needs: [lint, changes, typecheck, typecheck-tests, universe, universe-preparation, nebula]
    if: >-
      ${{ always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' ||
      needs.typecheck-tests.result == 'failure' || needs.universe.result == 'failure' ||
      needs.universe-preparation.result == 'failure' || needs.nebula.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Point at the job and step that actually failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate --jq '.jobs')
          found=0
          while IFS= read -r job; do
            job_name=$(echo "$job" | jq -r '.name')
            job_id=$(echo "$job" | jq -r '.id')
            step_name=$(echo "$job" | jq -r '[.steps[]? | select(.conclusion == "failure")][0].name // "(no failed step recorded)"')
            url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${job_id}"
            echo "::error::${job_name} -> ${step_name} failed: ${url}"
            echo "- ❌ **${job_name}** → ${step_name} failed: <${url}>" >> "$GITHUB_STEP_SUMMARY"
            found=1
          done < <(echo "$jobs_json" | jq -c '.[] | select(.conclusion == "failure" and .name != "Report the first CI failure")')
          if [ "$found" -eq 0 ]; then
            echo "::error::A required job failed, but the jobs API has not recorded which one yet."
            echo "- A required job failed; see the run's job list." >> "$GITHUB_STEP_SUMMARY"
          fi
