name: Publish prepared assets

# Publishes one object's baked bytes to R2 for a pull request whose author cannot, so an outside
# contributor is not blocked on a maintainer's laptop. The contributor still bakes and commits the
# inventory themselves — baking needs no credentials, only publishing does.
#
# Why this is safe to hand R2 write access, unlike an ordinary deploy secret:
#   * The `bake` job runs the pull request's code and has NO secrets.
#   * The `publish` job holds the secrets, checks out `main` for its tooling, and treats the
#     artifact purely as data — it never runs a script from the pull request.
#   * Keys are content-addressed (`runtime-assets/<sha256>/<filename>`) and
#     tools/publish-runtime-assets.mts refuses to upload a file whose bytes do not hash to its
#     inventory entry. A hostile branch can therefore only create keys equal to the hash of its own
#     bytes; it cannot overwrite an existing key with different content. The worst case is unreferenced
#     junk keys (storage cost, cleanable with tools/prune-runtime-assets.mts), not corruption.
#   * `bake` fails when the rebake does not reproduce the inventory the pull request committed, so the
#     only bytes that ever reach R2 are the ones that branch's own tracked inventory already pins.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number whose branch should be baked and published
        required: true
        type: string
      object:
        description: Object id to bake and publish (one per run)
        required: true
        type: string
      kind:
        description: Which preparation bakes this object
        required: true
        default: body
        type: choice
        options: [body, volume]

permissions:
  contents: read

concurrency:
  # One publish at a time per pull request; never cancel a run mid-upload.
  group: publish-prepared-assets-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the pull request head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      repository: ${{ steps.pr.outputs.repository }}
    steps:
      - name: Read the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request }}
          OBJECT: ${{ inputs.object }}
        run: |
          set -euo pipefail
          # An object id reaches a shell and a path below, so reject anything that is not the
          # id shape used everywhere else in this repository before it goes further.
          if ! printf '%s' "$OBJECT" | grep -qE '^[a-z][a-z0-9-]*$'; then
            echo "::error::Not an object id: $OBJECT"
            exit 1
          fi
          state=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "::error::Pull request #$NUMBER is $state, not OPEN."
            exit 1
          fi
          gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid,headRepository,headRepositoryOwner \
            --jq '"head_sha=\(.headRefOid)\nrepository=\(.headRepositoryOwner.login)/\(.headRepository.name)"' >> "$GITHUB_OUTPUT"
          echo "Publishing $OBJECT for #$NUMBER." >> "$GITHUB_STEP_SUMMARY"

  bake:
    name: Bake the object from the pull request
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No secrets are available to this job. It runs the pull request's own code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore the pinned source downloads
        run: node tools/restore-source-inputs.mts --object=${{ inputs.object }}
      - name: Bake
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          if [ "${{ inputs.kind }}" = volume ]; then
            pnpm build:tools
            pnpm prepare:volume "src/objects/${{ inputs.object }}"
          else
            pnpm prepare:planets --object=${{ inputs.object }}
          fi
      - name: Check the rebake reproduces the committed inventory
        # The contributor bakes and commits the inventory; this proves their tracked inventory matches
        # what the sources actually produce. It is also the security property the publish job leans on:
        # only bytes this branch's own inventory already pins can reach R2.
        run: |
          set -euo pipefail
          drift=$(git status --porcelain -- \
            "src/objects/${{ inputs.object }}/runtime-assets.json" \
            "src/objects/${{ inputs.object }}/prepared-assets.json")
          if [ -n "$drift" ]; then
            echo "::error::Rebaking changed the committed inventory, so it does not match this branch's sources:"
            echo "$drift"
            git --no-pager diff --stat -- "src/objects/${{ inputs.object }}"
            echo "Commit the regenerated inventory to the pull request, then publish again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Collect the baked files and their inventories
        run: |
          set -euo pipefail
          mkdir -p upload
          for path in "src/objects/${{ inputs.object }}/runtime-assets.json" \
                      "src/objects/${{ inputs.object }}/prepared-assets.json" ; do
            [ -f "$path" ] && { mkdir -p "upload/$(dirname "$path")"; cp "$path" "upload/$path"; }
          done
          for directory in "src/objects/${{ inputs.object }}/prepared" \
                           "public/scenes/${{ inputs.object }}" ; do
            [ -d "$directory" ] && { mkdir -p "upload/$directory"; cp -R "$directory/." "upload/$directory/"; }
          done
          du -sh upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-${{ inputs.object }}
          path: upload
          retention-days: 1

  publish:
    name: Publish the baked bytes to R2
    needs: [resolve, bake]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: r2-publish
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the publish credentials are configured
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set on the r2-publish environment."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `main`, deliberately: this job holds the R2 credentials, so every script it runs must be
          # reviewed code from the default branch, never the pull request's.
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        # --ignore-scripts: nothing here builds the site, and the publisher needs no postinstall step.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-${{ inputs.object }}
          path: artifact
      - name: Place the baked files as data
        # Copied into the checkout, never executed. The publisher reads the inventory and the bytes and
        # refuses any file whose content does not hash to its inventory entry, so the keys it writes are
        # always `runtime-assets/<sha256-of-these-bytes>/<filename>`.
        run: |
          set -euo pipefail
          rm -rf "src/objects/${{ inputs.object }}/prepared" "public/scenes/${{ inputs.object }}"
          cp -R artifact/. .
          rm -rf artifact
      - name: Publish
        run: node tools/publish-runtime-assets.mts --object=${{ inputs.object }}
      - name: Confirm every inventoried key is live
        run: node tools/check-assets-published.mts --object=${{ inputs.object }}
      - name: Report
        run: |
          echo "Published \`${{ inputs.object }}\` for #${{ inputs.pull_request }} (${{ needs.resolve.outputs.head_sha }})." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run the pull request's checks so its asset gate sees the published keys." >> "$GITHUB_STEP_SUMMARY"
