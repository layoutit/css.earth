name: Deploy

# Deployment is manual, with one exception: a merge that moves Earth's ENSO days ships the site, so the daily refresh
# (enso-daily.yml) reaches css.earth without a dispatch. Any other merge to main validates the gate; it does not ship.
# PR timing and publication/metadata rules: docs/ci-cd.md.

on:
  workflow_dispatch:
    inputs:
      incremental_build:
        description: Use incremental build
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'src/objects/earth/source/science/mur/**'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A dispatch always deploys, and so does the push of a merged ENSO move, whose pull request passed the required
    # checks on the tree it merged; an automatic run only when main's checks passed.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # An automatic run checks out the exact main commit whose checks passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          # __CSSEARTH_VERSION__ (site/astro.config.mts) counts commits with `git rev-list --count HEAD`;
          # a shallow checkout would undercount it.
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check deploy secrets
        run: |
          missing() { echo "::error::The repository secret $1 is not set; a deploy needs it ($2)."; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing CLOUDFLARE_API_TOKEN "a Cloudflare API token from the Edit Cloudflare Workers template"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing CLOUDFLARE_ACCOUNT_ID "the Cloudflare account id"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore generated share images
        id: share-images-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/share-image-cache
          key: share-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: share-images-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Plan incremental static cache
        if: github.event_name == 'workflow_dispatch' && inputs.incremental_build == true
        id: incremental-cache-key
        run: |
          set -euo pipefail
          lockfile=$(git rev-parse HEAD:pnpm-lock.yaml)
          echo "lockfile=$lockfile" >> "$GITHUB_OUTPUT"
      - name: Restore incremental static pages
        if: github.event_name == 'workflow_dispatch' && inputs.incremental_build == true
        id: incremental-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/incremental-build/astro-cache
          # Git refs cannot contain ':', so the restore prefix cannot match a longer sibling branch name.
          # The Deploy-only namespace also excludes PR benchmark caches.
          key: deploy-static-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.incremental-cache-key.outputs.lockfile }}-${{ github.ref }}:${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: "deploy-static-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.incremental-cache-key.outputs.lockfile }}-${{ github.ref }}:"
      - name: Build the site
        # The deploy build regenerates its ignored source/facility catalogues from committed inputs and the restored
        # R2 closure. Its catalog-only preparation does not publish preview bytes or rewrite asset inventories;
        # those authoring outputs must be published explicitly before a deploy is allowed to reference them.
        # ASSET_ORIGIN points every texture, scene JSON and startup preload at the published R2
        # bucket instead of bundling site/public/scenes (1.44 GB) into the deploy; site/astro.config.mts
        # removes dist/scenes once the build finishes and the assemble step tolerates its absence.
        # Publication proof: with no restored cache, the build's first setup downloads every inventoried key from that
        # R2 origin and checks its bytes against the inventory's content address (about 30 s for 19,954 keys); a key R2 does not serve fails the
        # build. A HEAD sweep of the same keys (check:assets-published) took 8 to 12 minutes here and proved less; the
        # nightly sweep keeps it.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # The deploy imports the packages' JavaScript only; their type declarations were most of build:packages.
          CSSEARTH_SKIP_DECLARATIONS: '1'
          CSSEARTH_ALLOW_MISSING_ASSETS: '0'
          # Only an explicitly checked manual dispatch enables either build experiment.
          CSSEARTH_INCREMENTAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.incremental_build == true && '1' || '0' }}
          CSSEARTH_STATIC_STYLES: ${{ github.event_name == 'workflow_dispatch' && inputs.incremental_build == true && '1' || '0' }}
        run: |
          # Textures and scene JSON resolve to R2: a Worker's static assets cannot hold site/public/scenes.
          ASSET_ORIGIN=https://earth-assets.lowpoly.cc pnpm build:deploy
          pnpm check:deploy-assets
      - name: Check the build output
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing; the build did not produce a site."
            exit 1
          fi
          page_count=$(find dist -name '*.html' | wc -l | tr -d ' ')
          echo "Built $page_count HTML pages."
          du -sh dist
          # Expected ~974 pages (see PLAN_TO_GH_PAGES_RELEASE.md). The margin is a backstop
          # against a truncated build; missing prepared assets now fail the build above.
          min_pages=900
          if [ "$page_count" -lt "$min_pages" ]; then
            echo "::error::Only $page_count HTML pages were built (expected roughly 974, refusing below $min_pages). Refusing to deploy a truncated site."
            exit 1
          fi
          if ! git diff --quiet -- src/objects; then
            echo "::error::Deploy preparation changed committed object metadata. Prepare and publish it explicitly before deploying."
            git diff --name-only -- src/objects
            exit 1
          fi
      - name: Save validated share images
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/share-image-cache
          key: ${{ steps.share-images-cache.outputs.cache-primary-key }}
      - name: Save validated incremental static pages
        if: github.event_name == 'workflow_dispatch' && inputs.incremental_build == true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/incremental-build/astro-cache
          key: ${{ steps.incremental-cache.outputs.cache-primary-key }}
      - name: Publish the prebuilt site to Cloudflare
        # Bundles the Worker, answers one search and one page from the bundle, and uploads it with the built pages as its
        # static assets (deploy/cloudflare/wrangler.jsonc, the `production` environment). docs/ci-cd.md, "Serving the site from Cloudflare".
        run: pnpm deploy:cloudflare
