name: Deploy

# Deployment is manual. Merging to main validates the gate; it does not ship.
# PR timing and publication/metadata rules: docs/ci-cd.md.

on:
  workflow_dispatch:
    inputs:
      bundle_textures:
        description: Bundle public/scenes into the deploy instead of serving it from R2 (rollback switch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A dispatch always deploys; an automatic run only when main's checks passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HOSTING_AUTH_TOKEN: ${{ secrets.HOSTING_AUTH_TOKEN }}
      HOSTING_SITE_ID: ${{ secrets.HOSTING_SITE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # An automatic run checks out the exact main commit whose checks passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          # __CSSEARTH_VERSION__ (astro.config.mts) counts commits with `git rev-list --count HEAD`;
          # a shallow checkout would undercount it.
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check deploy inputs
        run: |
          test -n "$HOSTING_AUTH_TOKEN"
          test -n "$HOSTING_SITE_ID"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The same paths and key as the CI jobs (universe.yml), which save this cache on main pushes. setup:assets
          # then sha-verifies every restored file and fetches only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: inventory-v1-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: inventory-v1-
      - name: Build the site
        # The deploy build regenerates its ignored source/facility catalogues from committed inputs and the restored
        # R2 closure. Its catalog-only preparation does not publish preview bytes or rewrite asset inventories;
        # those authoring outputs must be published explicitly before a deploy is allowed to reference them.
        # ASSET_ORIGIN points every texture, scene JSON and startup preload at the published R2
        # bucket instead of bundling public/scenes (1.44 GB) into the deploy; astro.config.mts
        # removes dist/scenes once the build finishes and the assemble step tolerates its absence.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Default: textures and scene JSON resolve to R2, so the deploy ships no public/scenes copy.
          # This cannot be a dispatch input that defaults on, because the automatic workflow_run path has
          # no inputs at all and shares the `production-deploy` concurrency group with cancel-in-progress:
          # a green main would cancel a hand-dispatched R2 deploy and publish the bundled build instead.
          # `bundle_textures` is the rollback: dispatch with it set to fall back to same-origin /scenes/.
          BUNDLE_TEXTURES: ${{ inputs.bundle_textures }}
        run: |
          if [ "$BUNDLE_TEXTURES" = "true" ]; then
            pnpm build:deploy
          else
            ASSET_ORIGIN=https://earth-assets.lowpoly.cc pnpm build:deploy
            pnpm check:deploy-assets
            pnpm check:assets-published --require-verified
          fi
      - name: Check the build output
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing; the build did not produce a site."
            exit 1
          fi
          page_count=$(find dist -name '*.html' | wc -l | tr -d ' ')
          echo "Built $page_count HTML pages."
          du -sh dist
          # Expected ~974 pages (see PLAN_TO_GH_PAGES_RELEASE.md). The margin is a backstop
          # against a truncated build; missing prepared assets now fail the build above.
          min_pages=900
          if [ "$page_count" -lt "$min_pages" ]; then
            echo "::error::Only $page_count HTML pages were built (expected roughly 974, refusing below $min_pages). Refusing to deploy a truncated site."
            exit 1
          fi
          if ! git diff --quiet -- src/objects; then
            echo "::error::Deploy preparation changed committed object metadata. Prepare and publish it explicitly before deploying."
            git diff --name-only -- src/objects
            exit 1
          fi
      - name: Publish the prebuilt site
        # netlify.toml supplies the edge route and the search function; the site is not linked to git,
        # so Actions is the only thing that deploys it.
        #
        # netlify-cli treats this repo's pnpm workspace packages (packages/*, labs/nebula/packages/*,
        # atlas) as ambiguous deploy candidates when invoked from inside the checkout, and fails
        # non-interactively in CI ("Projects detected: ...") even with valid credentials — reproduced
        # locally with netlify-cli 27.8.0 from this exact checkout. Its own escape hatch only skips
        # that workspace-selection prompt when --cwd resolves to a directory OTHER than the process's
        # actual working directory, so this step runs from $RUNNER_TEMP and points --cwd/--dir at the
        # checkout with absolute paths. netlify.toml, the edge function and the search function are
        # still read from the checkout (via --cwd), not from $RUNNER_TEMP.
        run: |
          cd "$RUNNER_TEMP"
          pnpm --package=netlify-cli@27.8.0 dlx netlify deploy \
            --cwd "$GITHUB_WORKSPACE" \
            --prod \
            --dir="$GITHUB_WORKSPACE/dist" \
            --no-build \
            --auth "$HOSTING_AUTH_TOKEN" \
            --site "$HOSTING_SITE_ID"
