name: Repository audit

# Repository completeness and provenance backlog. Nothing here gates a merge or a deploy: it lives in
# its own workflow so a stale ledger, an unrestorable source pin or a broken link cannot turn the
# Shared universe run red and stop `main` from deploying. See docs/ci-cd.md, "Gate on what ships".

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository and provenance audit (advisory)
    # Advisory by construction: this job is deliberately NOT in the repository's required status checks, so a
    # failure here is reported on the pull request and in the run summary without vetoing an unrelated change.
    # Nothing is skipped, tolerated or wrapped in `continue-on-error` — every check below still runs on every
    # commit and still turns this job red. What moved here asserts repository *completeness* (a package file that
    # has not been written yet, a source input that cannot be re-downloaded, a stale link, a misplaced file);
    # none of it can make the deployed site broken, wrong or unverifiable. See docs/ci-cd.md, "Gate on what ships".
    # Not on pull requests. Nothing here can block a merge, so running it per pull request spends CI
    # minutes on a report nobody can act on in that context. It runs on every push to main, where the
    # backlog it tracks is actually reconciled, and in the nightly sweep.
    runs-on: ubuntu-latest
    # Also covers the two relocated bookkeeping lanes, which run here in series where the gate ran them in
    # parallel. This job reports, so its latency sits outside the required-path budget in docs/ci-cd.md.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Every step below carries `if: ${{ !cancelled() }}` so the job runs to the end and reports
      # all of its findings. This audit exists to show backlog; stopping at the first failure hid
      # the rest, which is how a `pnpm lint` step ordered before `pnpm` was installed survived
      # unnoticed behind 541 documentation findings.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History without blobs: the documentation audit diffs against a merge base, and
          # `git diff --name-only` needs only commits and trees.
          fetch-depth: 0
          filter: blob:none
      - name: Check documentation links and organization
        if: ${{ !cancelled() }}
        # PRs reject new findings and debt in changed files, including unchanged inbound links they break.
        # Main retains the full organization audit; existing unrelated debt is visible but not a PR veto.
        run: |
          node --test .github/scripts/audits/check-documentation-links.test.mts
          python3 .github/scripts/audits/test_provenance_documentation_inventory.py
          python3 .github/scripts/audits/provenance-documentation-inventory.py --repo . --ref HEAD --output "$RUNNER_TEMP/provenance-inventory.json"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node .github/scripts/audits/check-documentation-links.mts --base "${CI_BASE_REF:-origin/$GITHUB_BASE_REF}"
          else
            node .github/scripts/audits/check-documentation-links.mts --all
          fi
      - name: Check tracked files against ignore rules
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked-paths"
          set +e
          git check-ignore --no-index --stdin -z < "$RUNNER_TEMP/tracked-paths" > "$RUNNER_TEMP/ignored-tracked"
          check_result=$?
          tr '\0' '\n' < "$RUNNER_TEMP/ignored-tracked"
          test "$check_result" -eq 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() }}
        with:
          # Restore-only: `Contract lint` owns the save for every key below, so the two jobs never race to
          # write the same cache entry.
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-
      - name: Install dependencies and prove the lockfile
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the bake package
        if: ${{ !cancelled() }}
        # The astronomy data ledger check below resolves the ledger and its library through the built
        # @cssearth/bake package, like every other packages/bake/cli entry; --ignore-scripts above skipped
        # the postinstall build.
        run: pnpm --filter "@cssearth/bake..." build
      - name: Check the astronomy data ledger
        if: ${{ !cancelled() }}
        # SQLite integrity, evidence hashes, source counts, proposal writeups and the export slices.
        # Nothing ran it after #869, so an edited ledger could drift from its own checks unseen.
        run: node packages/bake/cli/astronomy-data-verify.mts
      - name: Lint every authored tree
        if: ${{ !cancelled() }}
        # `tools`, `src` and `site` had no ESLint at all, so the size and boundary rules governed
        # only the two smallest trees. Warnings are reported here; `lint:packages` still fails on
        # any warning inside `packages/`, where the rules have always been enforced.
        run: pnpm lint
      - name: Check that no directory grew past its baseline
        if: ${{ !cancelled() }}
        # Convention, not correctness: a flat directory cannot break the shipped site, so this
        # reports rather than gates (docs/ci-cd.md, "Gate on what ships"). Ratcheted, so existing
        # flatness is visible without blocking work and the tree cannot get flatter while it is fixed.
        run: pnpm check:directory-growth
      - name: Hash tracked build and compiler inputs
        if: ${{ !cancelled() }}
        id: ci-cache-key
        run: node .github/scripts/ci/ci-cache-key.mts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() }}
        id: package-cache
        with:
          path: packages/*/dist
          key: compiled-packages-v2-${{ steps.ci-cache-key.outputs.package_digest }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() }}
        with:
          # Only the baked JSON payloads, not texture banks. The installer below revalidates every pin.
          path: |
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: prepared-json-v1-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: prepared-json-v1-
      - name: Generate the registry and renderer
        if: ${{ !cancelled() }}
        env:
          CI_PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          CI_PACKAGE_DIGEST: ${{ steps.ci-cache-key.outputs.package_digest }}
          CI_AUDIT_UNIVERSE: ${{ needs.changes.outputs.run_universe }}
          CI_AUDIT_PREPARATION: ${{ needs.changes.outputs.run_universe_preparation }}
        # The contract checks below need only the lint closure. The relocated source and reproduction lanes also
        # read navigation, world context and title assets, so they need the same `full` build they had on the gate.
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_UNIVERSE" != true ] && [ "$CI_AUDIT_PREPARATION" != true ]; then
            node .github/scripts/ci/build-ci.mts lint
          else
            node .github/scripts/ci/build-ci.mts full
          fi
      - name: Check every object's package files and source restoration plan
        if: ${{ !cancelled() }}
        # Package-file completeness (a body without its browser profile or ledger) and source *restorability*
        # (a declared input with neither a tracked copy nor an acquisition operation). Neither reaches the
        # deployed site: it serves the already-baked prepared bank from R2 at the addresses its inventory names.
        run: node --test tests/asset-publication/restore-source-inputs.test.mts
      - name: Reconcile the source catalogue, facility records and provenance receipts
        if: ${{ !cancelled() }}
        # Moved off the `Universe / sources` gate lane. These assert that every catalogue row, facility record
        # and provenance receipt reconciles with the tracked sources and their READMEs — repository bookkeeping.
        # The site serves the already-baked prepared bank its inventories name and reads none of it, so a
        # reconciliation gap cannot break a page; the inventories that back shipped bytes stay blocking. Nothing
        # is skipped or tolerated: the same commands run in full, with the same arguments, whenever the change
        # selects a universe area — the identical selection the gate lane applied as a job condition.
        env:
          CI_AUDIT_UNIVERSE: ${{ needs.changes.outputs.run_universe }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_UNIVERSE" != true ]; then
            echo "This change selects no universe area; the source catalogue has nothing to reconcile."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME:-}" != pull_request ]; then
            pnpm setup:asset-data
          else
            node .github/scripts/ci/prepare-ci-inputs.mts universe
          fi
          node packages/bake/cli/restore-object-json.mts
          node site/build/prepare/prepare-feature-index.mts
          # The source catalogue the facility tests reconcile is a generated, ignored file.
          node site/build/prepare/prepare-facilities.mts --catalog-only
          if [ "${GITHUB_EVENT_NAME:-}" != pull_request ]; then
            # Authoring replays the volume presentations from their FITS sources.
            node packages/bake/cli/restore-source-inputs.mts --repository-volumes
            CSSEARTH_SOURCE_CHECK_MODE=author node --test packages/objects/src/provenance/exploration-catalog.test.mts "tests/sources/*.test.mts" "packages/bake/src/sources/*.test.mts" packages/bake/src/objects/sources/source-manifest-parsers.test.mts "site/test/*{source,facilit}*.test.mts" "tests/objects/surface-observations/*.test.mts"
          else
            CSSEARTH_SOURCE_CHECK_MODE=published node --test packages/objects/src/provenance/exploration-catalog.test.mts "tests/sources/*.test.mts" "packages/bake/src/sources/*.test.mts" packages/bake/src/objects/sources/source-manifest-parsers.test.mts "site/test/*{source,facilit}*.test.mts" "tests/objects/surface-observations/*.test.mts"
          fi
      - name: Reproduce the prepared bank from its pinned inputs
        if: ${{ !cancelled() }}
        # Moved off the `Preparation / world` gate lane. These re-run a bake and compare it with the recorded
        # output: finalization idempotence and catalogue-row reconciliation. The site never bakes anything — it
        # serves the published bank at its R2 content address, so a reproduction gap is a stale recipe or a drifted
        # toolchain, visible here, and not a broken page. Nothing is skipped: the same commands run in full.
        env:
          CI_AUDIT_PREPARATION: ${{ needs.changes.outputs.run_universe_preparation }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$CI_AUDIT_PREPARATION" != true ]; then
            echo "This change selects no preparation area; there is no bake to reproduce."
            exit 0
          fi
          node .github/scripts/ci/prepare-ci-inputs.mts universe-preparation
          # The galaxy writer finishes before world/provenance readers in this workspace.
          node packages/bake/cli/restore-source-inputs.mts --repository-volumes
          pnpm test:preparation --universe
      - name: Explain that this job does not gate the merge
        if: failure()
        run: |
          {
            echo "### Repository and provenance audit failed (advisory)"
            echo
            echo "This job reports repository completeness and provenance backlog. It is **not** a required"
            echo "status check: it does not block this pull request. Fix it in the change that owns the gap,"
            echo "or file it as backlog. Merge-blocking proof is what ships: it compiles (\`Typecheck\`), it"
            echo "builds, and it behaves (the universe runtime/shell/renderer lanes and \`Contract lint\`)."
          } >> "$GITHUB_STEP_SUMMARY"
