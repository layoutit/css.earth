name: Share-image build benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read

# An unrelated label event must not cancel a measurement already running.
concurrency:
  group: share-build-benchmark-${{ github.run_id }}
  cancel-in-progress: false

env:
  BENCHMARK_HEAD: ${{ github.event.pull_request.head.sha }}
  NODE_OPTIONS: --max-old-space-size=6144
  CSSEARTH_SKIP_DECLARATIONS: '1'
  CSSEARTH_ALLOW_MISSING_ASSETS: '0'
  ASSET_ORIGIN: https://earth-assets.lowpoly.cc
  TZ: UTC
  LC_ALL: C

jobs:
  seed:
    name: Share cache seed
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'compare-build') && (github.event.action != 'labeled' || github.event.label.name == 'compare-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      result: ${{ steps.finish.outputs.result }}
      cache_key: ${{ steps.plan.outputs.seed_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fresh dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind candidate and cache keys
        id: plan
        run: node .github/scripts/ci/build-benchmark.mts plan seed
      - name: Build and validate the candidate
        run: node .github/scripts/ci/build-benchmark.mts run seed
      - name: Save seed share cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/share-image-cache
          key: ${{ steps.plan.outputs.seed_key }}
      - name: Prove seed cache and record result
        id: finish
        env:
          BENCHMARK_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci/build-benchmark.mts finish seed

  baseline:
    name: Uncached share baseline
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      result: ${{ steps.finish.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fresh dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind candidate and cache keys
        run: node .github/scripts/ci/build-benchmark.mts plan baseline
      - name: Build and validate the uncached control
        env:
          BENCHMARK_SEED_RESULT: ${{ needs.seed.outputs.result }}
        run: node .github/scripts/ci/build-benchmark.mts run baseline
      - name: Compare seed output and record result
        id: finish
        env:
          BENCHMARK_SEED_RESULT: ${{ needs.seed.outputs.result }}
        run: node .github/scripts/ci/build-benchmark.mts finish baseline

  warm:
    name: Cached share warm
    needs: [seed, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fresh dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind candidate and cache keys
        id: plan
        run: node .github/scripts/ci/build-benchmark.mts plan warm
      - name: Restore exact seed share cache
        id: restored
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/share-image-cache
          key: ${{ steps.plan.outputs.warm_key }}
          restore-keys: ${{ needs.seed.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Build and validate warm candidate
        env:
          BENCHMARK_MATCHED_KEY: ${{ steps.restored.outputs.cache-matched-key }}
          BENCHMARK_SEED_RESULT: ${{ needs.seed.outputs.result }}
          BENCHMARK_BASELINE_RESULT: ${{ needs.baseline.outputs.result }}
        run: node .github/scripts/ci/build-benchmark.mts run warm
      - name: Save warm share cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/share-image-cache
          key: ${{ steps.plan.outputs.warm_key }}
      - name: Prove transfers and compare complete outputs
        env:
          BENCHMARK_TOKEN: ${{ github.token }}
          BENCHMARK_SEED_RESULT: ${{ needs.seed.outputs.result }}
          BENCHMARK_BASELINE_RESULT: ${{ needs.baseline.outputs.result }}
        run: node .github/scripts/ci/build-benchmark.mts finish warm
