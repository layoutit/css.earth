name: Nightly asset sweep

# PR feedback budget: target 2 minutes, maximum 3 minutes end to end for all
# merge-required checks. Exhaustive sweeps stay scheduled/manual. The production
# build/browser probe below is separate, change-selected qualification; do not
# make it merge-required without bringing it inside that same total budget.
# Maintenance rules and failure recovery: docs/ci-cd.md.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select production build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_production: ${{ steps.classify.outputs.run_production }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.mts
            /.github/ci-areas.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Use the shared PR plan
        id: classify
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            node tools/ci/ci-affected.mts pr "origin/$GITHUB_BASE_REF"
          else
            echo "run_production=true" >> "$GITHUB_OUTPUT"
          fi

  assets:
    name: Every published asset
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the object registry
        # `tools/prepare/prepare-catalog.mts` reaches `tools/prepare/prepare-object-discovery.mts`, which imports the built
        # `src/renderers/css/dist/navigation.js`; `build:astronomy` alone never produces it, so the catalog step
        # died with ERR_MODULE_NOT_FOUND. `build:packages` + `build:renderer` are the two steps of `build:tools`
        # that produce it, without the preparation bundles this job never reads.
        run: pnpm build:packages && pnpm build:renderer && pnpm prepare:catalog
      - name: Check every inventoried key is published
        # PRs and main pushes check only the keys they add. Only this full sweep notices R2 losing an object whose
        # inventory line did not change; concurrency 8 matches the shared agent's connection cap. A real 404 fails
        # the job and is listed in its summary; unverified (network) keys only warn.
        run: pnpm check:assets-published --concurrency=8

  typecheck-tests:
    # The full test program also runs on owning PRs and main; this catches ambient dependency drift.
    name: Typecheck test files
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages and affected entry points
        run: pnpm build:tools
      - name: Restore only compiler inputs and generate real shell data
        run: pnpm prepare:typecheck
      - name: Typecheck test, fixture and capture files
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck:tests

  asset-origin-build:
    needs: changes
    if: needs.changes.outputs.run_production == 'true'
    # Exercises the one path that has broken two real deploys and that no other CI job builds at all: a full
    # `pnpm build:deploy` with `ASSET_ORIGIN` set, the same as .github/workflows/deploy.yml's production path. The static
    # scan catches emitted same-origin addresses; the production browser test also exercises the client loader,
    # whose descriptor path can otherwise discard an origin that is present in the emitted page.
    name: Build with ASSET_ORIGIN and exercise the client loader
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # __CSSEARTH_VERSION__ (astro.config.mts) counts commits with `git rev-list --count HEAD`.
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The same paths and key as universe.yml/deploy.yml. setup:assets sha-verifies every restored file and
          # downloads only what is missing or changed.
          path: |
            public/scenes
            src/objects/*/prepared/runtime.json
            src/objects/*/prepared/scene.json
          key: inventory-v1-${{ hashFiles('src/objects/*/inventory.json') }}
          restore-keys: inventory-v1-
      - name: Build the site with the production asset origin and reject metadata drift
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CSSEARTH_ALLOW_MISSING_ASSETS: "1"
          ASSET_ORIGIN: https://earth-assets.lowpoly.cc
        run: |
          pnpm build:deploy
          pnpm check:deploy-assets
      - name: Check no page references a same-origin /scenes/ address
        run: node tools/assets/check-asset-origin-scenes.mts dist
      - name: Check production navigation loads content-addressed assets
        env:
          CSSEARTH_TEST_ORIGIN: http://127.0.0.1:4212
          CSSEARTH_ASSET_ORIGIN: https://earth-assets.lowpoly.cc
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm preview --port 4212 > /tmp/cssearth-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4212/ >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/cssearth-preview.log; exit 1; fi
            sleep 1
          done
          node site/test/navigation-production-browser.mts
